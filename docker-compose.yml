###############################################################################
# tr-engine stack: PostgreSQL + Mosquitto + tr-engine (+ tr-dashboard + Caddy)
#
# Quick start (docs/docker.md): only postgres, mosquitto and tr-engine are
# needed; start them with `docker compose up -d postgres mosquitto tr-engine`.
# For a public HTTPS deployment use docker-compose.full.yml instead
# (docs/docker-full-stack.md).
#
# Security defaults:
#   - There is no default database password: POSTGRES_PASSWORD must be set
#     in .env or compose refuses to start.
#   - PostgreSQL is never published on the host.
#   - Mosquitto requires a login (mosquitto/mosquitto.conf + mosquitto/passwd).
#   - Every published port binds to 127.0.0.1 unless you choose otherwise:
#       HTTP_BIND_IP  tr-engine :8080   (default 127.0.0.1)
#       MQTT_BIND_IP  mosquitto :1883   (default 127.0.0.1; set it for
#                                        trunk-recorders on other hosts)
#       BIND_IP       caddy :80/:443    (default 127.0.0.1)
#
# First run:
#   cp sample.env .env    # set POSTGRES_PASSWORD, MQTT_USERNAME, MQTT_PASSWORD
#   mkdir -p mosquitto    # plus mosquitto/mosquitto.conf from this repo
#   # create mosquitto/passwd; first export the same MQTT_USERNAME and
#   # MQTT_PASSWORD you put in .env:
#   docker run --rm -e MQTT_USERNAME -e MQTT_PASSWORD -v "$PWD/mosquitto:/mosquitto/config" \
#     eclipse-mosquitto:2 sh -c 'mosquitto_passwd -c -b /mosquitto/config/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD" && chown mosquitto:mosquitto /mosquitto/config/passwd'
#   docker compose up -d postgres mosquitto tr-engine
#   # tr-engine prints an admin API key once on first start:
#   docker compose logs tr-engine | grep -A3 "no admin API key"
#   # manage keys and anonymous access (docs/auth.md):
#   docker compose exec -T tr-engine tr-engine keys --help
###############################################################################

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (generate one with openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-trengine}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trengine}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Loopback by default. Remote trunk-recorders need an explicit opt-in:
      # set MQTT_BIND_IP in .env to a LAN/VPN address (or 0.0.0.0).
      - "${MQTT_BIND_IP:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      # Long syntax so a missing file is an error instead of Docker silently
      # creating an empty directory in its place.
      - type: bind
        source: ./mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mosquitto/passwd
        target: /mosquitto/config/passwd
        read_only: true
        bind:
          create_host_path: false
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  tr-engine:
    image: ghcr.io/trunk-reporter/tr-engine:latest
    ports:
      # Loopback by default (web UI/API at http://localhost:8080). To reach it
      # from other machines, set HTTP_BIND_IP, and decide on anonymous access
      # first (tr-engine access show/set; docs/auth.md).
      - "${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trengine}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trengine}?sslmode=disable
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-trengine}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env (must match mosquitto/passwd)}
      AUDIO_DIR: /data/audio
    volumes:
      - ./audio:/data/audio
      # Optional: TR auto-discovery (set TR_DIR=/tr-config in .env)
      # - /path/to/trunk-recorder:/tr-config:ro
      # Optional: serve TR audio directly (set TR_AUDIO_DIR=/tr-audio in .env)
      # - /path/to/trunk-recorder/audio:/tr-audio:ro
      # Optional: web UI override (changes apply without restart)
      # - ./web:/opt/tr-engine/web
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  tr-dashboard:
    image: ghcr.io/trunk-reporter/tr-dashboard:latest
    # Static app on :3000. It calls /api/v1 on its own origin, so the Caddyfile
    # routes /api/* on the dashboard domain to tr-engine. To call tr-engine on
    # another origin instead, set VITE_API_BASE (tr-engine allows any origin).
    # Never inject an API key here or in the proxy: a key that reaches
    # visitors' browsers is public. Users paste their own key in the dashboard;
    # anonymous visitors get whatever the anonymous access policy allows.
    # environment:
    #   VITE_API_BASE: https://api.example.com/api/v1
    depends_on:
      - tr-engine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:80:80"
      - "${BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tr-engine
      - tr-dashboard
    restart: unless-stopped

  # Optional: Prometheus metrics for PostgreSQL
  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter:latest
  #   ports:
  #     - "127.0.0.1:9187:9187"   # unauthenticated metrics: loopback only
  #   environment:
  #     DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-trengine}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trengine}?sslmode=disable
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  mosquitto-data:
  caddy-data:
  caddy-config:
