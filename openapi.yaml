                $ref: "#/components/schemas/Error"

  /admin/transcribe-backfill:
    post:
      operationId: submitTranscribeBackfill
      x-scope: admin
      x-restricted: deny
      summary: Submit transcription backfill job
      description: |
        Queues a background job to find untranscribed calls matching the
        provided filters and drip-feed them into the transcription queue.
        Jobs are processed sequentially — if a job is already active, the
        new job is queued. All filter fields are optional; omitting all
        filters backfills every untranscribed call.

        A job makes a single pass over the matching calls, newest first, and
        hands each call to the transcription queue at most once. A call whose
        transcription then fails (for example, because its audio file is
        missing) stays untranscribed and is not retried by the same job; a
        later job will pick it up again.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillFilters"
      responses:
        "202":
          description: Backfill job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                    description: Unique identifier for this backfill job
                    example: 1
                  position:
                    type: integer
                    description: Position in the queue (0 = active, 1+ = queued)
                    example: 0
                  total:
                    type: integer
                    description: |
                      Number of untranscribed calls matching filters at
                      submission. Recounted when the job starts.
                    example: 342
                  filters:
                    $ref: "#/components/schemas/BackfillFilters"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Transcription not configured or pipeline not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getTranscribeBackfillStatus
      x-scope: admin
      x-restricted: deny
      summary: Get transcription backfill status
      description: |
        Returns the active and queued backfill jobs. The `active` field
        is null when no job is currently running. The `queued` array
        contains jobs waiting to start, in submission order.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backfill status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Pipeline not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cancelAllTranscribeBackfill
      x-scope: admin
      x-restricted: deny
      summary: Cancel all backfill jobs
      description: Cancels the active backfill job (if any) and all queued jobs.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All backfill jobs cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No backfill jobs found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Pipeline not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/transcribe-backfill/{id}:
    delete:
      operationId: cancelTranscribeBackfill
      x-scope: admin
