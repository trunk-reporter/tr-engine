          description: "Rows deleted in phase 1 (1 week – 1 month old: keep 1 per minute)"
          example: 500
        phase2_deleted:
          type: integer
          description: "Rows deleted in phase 2 (>1 month old: keep 1 per hour)"
          example: 120

    BackfillFilters:
      type: object
      description: Optional filters for a transcription backfill job. All fields are optional — omitting all filters targets every untranscribed call.
      properties:
        system_id:
          type: integer
          description: Restrict to calls from this system
          example: 1
        tgids:
          type: array
          items:
            type: integer
          description: Restrict to calls on these talkgroup IDs
          example: [9178, 9112]
        start_time:
          type: string
          format: date-time
          description: Only include calls after this time (RFC 3339)
        end_time:
          type: string
          format: date-time
          description: Only include calls before this time (RFC 3339)

    BackfillJob:
      type: object
      description: State of a single transcription backfill job.
      properties:
        job_id:
          type: integer
          description: Unique job identifier
          example: 1
        filters:
          $ref: "#/components/schemas/BackfillFilters"
        total:
          type: integer
          description: |
            Number of calls this job covers: the matching untranscribed calls
            counted when the job starts, raised if more calls become eligible
            while it runs. `completed + failed` never exceeds it, but can
            finish below it if some calls were transcribed by other means
            first.
          example: 342
        completed:
          type: integer
          description: |
            Number of distinct calls handed to the transcription queue so far.
            Counts enqueues, not finished transcriptions: a call whose
            transcription later fails (e.g. missing audio file) is still
            counted here. Each call is counted at most once per job.
          example: 57
        failed:
          type: integer
          description: |
            Number of distinct calls that could not be enqueued (call could not
            be loaded, not supported by the STT provider, or transcription
            queue full). Not retried within the job.
          example: 2
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When processing started (null if still queued)
        created_at:
          type: string
          format: date-time
          description: When the job was submitted

    BackfillStatus:
      type: object
      description: Current state of the transcription backfill system.
      properties:
        active:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/BackfillJob"
          description: Currently running backfill job, or null if idle
        queued:
          type: array
          items:
            $ref: "#/components/schemas/BackfillJob"
          description: Jobs waiting to start, in submission order

    StreamJitterSnapshot:
      type: object
      properties:
        system_id:
          type: integer
          description: System ID
        tgid:
          type: integer
          description: Talkgroup ID
        count:
          type: integer
          description: Number of inter-packet deltas recorded
        min_ms:
          type: number
          format: double
          description: Minimum inter-packet delta in milliseconds
        max_ms:
          type: number
          format: double
          description: Maximum inter-packet delta in milliseconds
        mean_ms:
          type: number
          format: double
          description: Mean inter-packet delta in milliseconds
        stddev_ms:
          type: number
          format: double
          description: Standard deviation of inter-packet deltas in milliseconds
        last_delta_ms:
          type: number
          format: double
          description: Most recent inter-packet delta in milliseconds
        started_at:
          type: string
          format: date-time
          description: When this stream became active

    RetentionConfigUpdate:
      type: object
      description: Request body for updating a retention setting.
      required: [key, value]
      properties:
        key:
          type: string
          description: Retention config key
          enum:
            - retention_raw_messages
            - retention_console_logs
            - retention_plugin_status
            - retention_trunking_messages
            - retention_checkpoints
            - retention_stale_calls
            - retention_audit_log
          example: "retention_console_logs"
        value:
          type: string
          description: "Go duration string (e.g. 48h, 720h, 7d)"
          example: "48h"

    StorageStats:
      type: object
      description: Database storage statistics including per-table sizes and partition breakdowns.
      properties:
        total_db_bytes:
          type: integer
          format: int64
          description: Total database size in bytes
          example: 8589934592
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableSizeInfo"
          description: Per-table size information, sorted by total_bytes descending
        errors:
          type: array
          items:
            type: string
          description: Per-table errors that occurred during stat collection. Affected tables are omitted from `tables`.
          example: ["failed to get partitions for some_table: connection timeout"]

    TableSizeInfo:
      type: object
      description: Size information for a single database table.
      properties:
        name:
          type: string
          description: Table name
          example: "mqtt_raw_messages"
        row_count:
          type: integer
          format: int64
          description: "Estimated live row count (from pg_stat_user_tables)"
          example: 4200000
        table_bytes:
          type: integer
          format: int64
          description: "Table data size in bytes (pg_table_size)"
          example: 5368709120
        index_bytes:
          type: integer
          format: int64
          description: "Index size in bytes (pg_indexes_size)"
          example: 536870912
        total_bytes:
          type: integer
          format: int64
          description: "Total relation size in bytes (pg_total_relation_size)"
          example: 5905580032
        partitions:
          type: array
          items:
            $ref: "#/components/schemas/PartitionInfo"
          description: Per-partition breakdown. Only present for partitioned tables.

    PartitionInfo:
      type: object
      description: Size information for a single table partition.
      properties:
        name:
          type: string
          description: Partition name
          example: "mqtt_raw_messages_2026_w14"
        total_bytes:
          type: integer
          format: int64
          description: "Total relation size in bytes"
          example: 2684354560

    PurgeRequest:
      type: object
      description: Request body for manual table purge.
      required: [older_than]
      properties:
        older_than:
          type: string
          description: |
            Rows/partitions older than this will be deleted. A Go duration
            (`48h`) or a whole number of days (`7d`); at least `1h`. Zero,
            negative or shorter values are rejected with 400.
          example: "48h"

    PurgeResponse:
      type: object
      description: Response from a manual table purge operation.
      properties:
        table:
          type: string
          description: Table that was purged
          example: "mqtt_raw_messages"
        older_than:
          type: string
          description: The duration threshold that was used
          example: "48h"
        rows_deleted:
          type: integer
          format: int64
          description: Number of rows deleted (null for partition-drop purges)
          nullable: true
          example: null
        partitions_dropped:
          type: integer
          description: Number of partitions dropped (null for row-delete purges)
          nullable: true
          example: 2
        partitions_dropped_names:
          type: array
          items:
            type: string
          description: Names of dropped partitions (only when partitions were dropped)
          example: ["mqtt_raw_messages_2025_w48"]
        timed_out:
          type: boolean
          description: True if the 5-minute context deadline expired before completion
          example: false
        duration_ms:
          type: integer
          description: Wall-clock duration of the purge operation in milliseconds
          example: 4823
        warning:
          type: string
          description: "Always present, reminding that this action is irreversible"
          example: "This action is irreversible."
