  # ----------------------------------------------------------
  # Admin
  # ----------------------------------------------------------
  /query:
    post:
      operationId: executeQuery
      x-scope: admin
      x-restricted: deny
      summary: Execute a read-only SQL query
      description: |
        Executes an ad-hoc read-only SQL query against the database and
        returns the results. Useful for analytical queries that don't map
        to predefined endpoints.

        **Safety measures:**
        - Query runs inside a `READ ONLY` transaction — INSERT, UPDATE,
          DELETE, DROP, and all other write operations are rejected by
          PostgreSQL.
        - A 30-second statement timeout prevents runaway queries.
        - Results are capped at `limit` rows (default 1000, max 50000).
        - Semicolons are rejected to prevent multi-statement injection.

        Use `$1`, `$2`, etc. as parameter placeholders with the `params`
        array for safe value interpolation.

        Needs the `admin` scope: raw SQL can read every table and cannot
        honour a restriction. The query runs as the engine's own database
        role; if that role is a superuser (or can read server files), a
        query can too. Run the engine with a dedicated, non-superuser
        database role.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              simple:
                summary: Count all units
                value:
                  sql: "SELECT count(*) FROM units"
              parameterized:
                summary: Units on a specific talkgroup
                value:
                  sql: "SELECT DISTINCT ct.src AS unit_id FROM call_transmissions ct JOIN calls c ON c.call_id = ct.call_id AND c.start_time = ct.call_start_time WHERE c.tgid = $1"
                  params: [9178]
                  limit: 500
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: Invalid query (parse error, write attempt, timeout, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/systems/merge:
    post:
      operationId: mergeSystems
      x-scope: admin
      x-restricted: deny
      summary: Merge two systems
      description: |
        Merges all data from `source_id` into `target_id`, then deletes
        the source system. Use this to fix fragmentation caused by
        instance_id or sys_name changes, or to consolidate an unknown
        system after identification.

        **What happens:**
        - All calls under source are repointed to target system_id
          (call_ids are database PKs and do not change)
        - Talkgroups: source talkgroups are merged into target. If both
          have the same tgid, target metadata is kept and call counts are
          combined. Source-only talkgroups are moved to target.
        - Units: same merge logic as talkgroups
        - Unit events: repointed to target system_id
        - Talkgroup directory entries (imported CSV data): merged into
          the target; the target keeps its non-empty values
        - Call groups may be consolidated (recordings that now share
          system_id + tgid + start_time get grouped)
        - Source system is deleted

        **Restrictions** on API keys and the anonymous access policy are
        rewritten in the same transaction:
        - Allow entries that name the source (`systems`, and `source:tgid`
          in `talkgroups`) are rewritten to the target.
        - `exclude_talkgroups` are made **symmetric**: an entry naming
          the source or the target is kept, and a copy naming the other
          one is added (along a chain of merges, every system of the
          chain), so data that still carries the old ID, or is written
          under it around the merge, stays excluded. Expect merged-away
          IDs to remain in stored exclusions. Exclusion lists can grow
          past the 1000-entry input limit this way; such a stored
          restriction stays valid (see `Restriction`).
        - A restriction stored later that names either system (keys, the
          anonymous policy) is rewritten the same way on store.
          A ticket narrowing that names the merged-away system anywhere,
          `exclude_talkgroups` included, is refused at mint time (400
          `invalid_body`); a ticket minted before the merge fails with
          401 `invalid_ticket`, and a stream it opened closes with the
          `ticket_expired` signal. Clients mint new tickets, and drop
          merged-away IDs when they copy exclusions from a stored
          restriction into a narrowing.

        A merge never leaves an allow entry (`systems`, `talkgroups`)
        pointing at a merged-away system and never voids an exclusion
        (exclusions keep the old ID next to the surviving one). It
        **can widen access**,
        though: an allow entry that named either system now covers the
        whole merged system, including the data the other system already
        had. That is intended when both are the same radio network. Before
        merging systems that are not, review restricted keys (`GET
        /keys`) and the anonymous policy (`GET /anonymous-access`).

        **Implications:**
        - Call IDs (database PKs) are stable — bookmarks don't break
        - Talkgroup and unit composite IDs change (old system_id prefix
          becomes invalid, new system_id prefix is correct)
        - This operation is **not reversible**

        After merging, update the trunk-recorder config so future MQTT
        messages use the target system's `(instance_id, short_name)`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemMergeRequest"
      responses:
        "200":
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMergeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Source or target system not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Merge would cause data conflicts that cannot be auto-resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

