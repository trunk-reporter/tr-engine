  # ----------------------------------------------------------
  # Talkgroups
  # ----------------------------------------------------------
  /talkgroups:
    get:
      operationId: listTalkgroups
      x-scope: listen
      x-restricted: enforced
      summary: List talkgroups
      description: |
        Returns talkgroups with cached stats (call_count, calls_1h, calls_24h,
        unit_count). Stats are refreshed every 5 minutes by a background task.
        For real-time stats, use the single-talkgroup endpoint.
        Supports filtering by system (database ID or P25 SYSID),
        group category, and free-text search. Search results include a
        relevance_score (100=exact, 50=prefix, 10=contains).
      tags: [talkgroups]
      parameters:
        - name: system_id
          in: query
          description: Filter by system database ID (comma-separated for multiple)
          schema:
            type: string
            example: "1,2"
        - name: sysid
          in: query
          description: Filter by P25 SYSID (comma-separated for multiple, e.g., "348,34D")
          schema:
            type: string
        - name: group
          in: query
          description: Filter by talkgroup group/category (e.g., "Fire", "Law Dispatch")
          schema:
            type: string
        - name: search
          in: query
          description: Search by alpha_tag, tgid, group, tag, or description
          schema:
            type: string
        - name: stats_days
          in: query
          deprecated: true
          description: >-
            No longer supported — returns 400 if provided.
            Use GET /talkgroups/{id} for real-time stats.
          schema:
            type: integer
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/sortDir"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalkgroupListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /talkgroups/{id}:
    get:
      operationId: getTalkgroup
      x-scope: listen
      x-restricted: enforced
      summary: Get a talkgroup
      description: |
        Returns a single talkgroup with real-time stats computed at request time.
        Accepts composite `system_id:tgid` format (e.g., "1:9178") or plain `tgid`.
        Returns 409 if a plain tgid is ambiguous across systems.
      tags: [talkgroups]
      parameters:
        - $ref: "#/components/parameters/talkgroupId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Talkgroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateTalkgroup
      x-scope: edit
      x-restricted: deny
      summary: Update talkgroup metadata
      description: >-
        Updates mutable talkgroup fields (alpha_tag, description, group,
        tag, priority). Only provided fields are changed; empty strings and a
        negative priority are ignored (they don't clear anything). Changing any
        of them marks the talkgroup `alpha_tag_source: manual` (any
        alpha_tag_source in the same request is ignored), so neither MQTT ingest
        nor a talkgroup CSV re-import will overwrite it. An unknown
        alpha_tag_source value is rejected with 400.
        When CSV_WRITEBACK is enabled and TR_DIR is configured with a talkgroupsFile,
        alpha_tag changes are also written back to trunk-recorder's talkgroup CSV file on disk
        and, when that succeeds, to the talkgroup directory entry. Otherwise the talkgroup
        directory (the imported CSV) is not changed by edits.
      tags: [talkgroups]
      parameters:
        - $ref: "#/components/parameters/talkgroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalkgroupPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Talkgroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /talkgroups/{id}/calls:
    get:
      operationId: listTalkgroupCalls
      x-scope: listen
      x-restricted: enforced
      summary: List calls for a talkgroup
      description: |
        Returns calls for a specific talkgroup. Accepts composite `system_id:tgid`
        or plain `tgid`.
      tags: [talkgroups]
      parameters:
        - $ref: "#/components/parameters/talkgroupId"
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /talkgroups/{id}/units:
    get:
      operationId: listTalkgroupUnits
      x-scope: listen
      x-restricted: deny
      summary: List units affiliated with a talkgroup
      description: |
        Returns units that have recent activity on this talkgroup, based on
        call participation and affiliation events.
      tags: [talkgroups]
      parameters:
        - $ref: "#/components/parameters/talkgroupId"
        - name: window
          in: query
          description: Activity window in minutes (1-1440)
          schema:
            type: integer
            default: 60
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /talkgroups/encryption-stats:
    get:
      operationId: getTalkgroupEncryptionStats
      x-scope: listen
      x-restricted: deny
      summary: Get encryption stats per talkgroup
      description: |
        Returns counts of encrypted vs clear calls per talkgroup from recent
        activity. Includes talkgroup display names.
      tags: [talkgroups]
      parameters:
        - name: hours
          in: query
          description: Hours of history to include
          schema:
            type: integer
            default: 24
        - name: sysid
          in: query
          description: Filter by P25 SYSID
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Talkgroup Directory
  # ----------------------------------------------------------
  /talkgroup-directory:
    get:
      operationId: listTalkgroupDirectory
      x-scope: listen
      x-restricted: enforced
      summary: Search talkgroup reference directory
      description: |
        Searches the talkgroup directory — a reference table imported from
        trunk-recorder's talkgroup CSV files via TR_DIR auto-discovery or
        CSV upload. Separate from the main talkgroups endpoint, which only
        contains talkgroups actually heard on the air.
      tags: [talkgroups]
      parameters:
        - name: system_id
          in: query
          description: Filter by system ID (repeatable)
          schema:
            type: integer
        - name: search
          in: query
          description: Full-text search across alpha_tag, description, tag, category
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: mode
          in: query
          description: Filter by mode (D, A, E, M)
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  talkgroups:
                    type: array
                    description: Empty array (never null) when nothing matches
                    items:
                      $ref: "#/components/schemas/TalkgroupDirectoryEntry"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /talkgroup-directory/import:
    post:
      operationId: importTalkgroupDirectory
      x-scope: admin
      x-restricted: deny
      summary: Upload talkgroup CSV
      description: |
        Imports a trunk-recorder talkgroup CSV file into the talkgroup directory.
        Accepts either `system_id` (must exist) or `system_name` (see the
        parameter). CSV format: Decimal, Hex, Alpha Tag, Mode,
        Description, Tag, Category (header-aware, column order doesn't matter;
        a UTF-8 BOM is ignored).

        The directory is then applied to heard talkgroups using the tag priority
        manual > csv > mqtt: a non-empty CSV alpha tag replaces an MQTT-discovered
        tag (and a previously imported CSV tag, so re-importing an edited CSV takes
        effect) and marks the talkgroup `alpha_tag_source: csv`, after which MQTT
        ingest no longer changes its alpha_tag/tag/group/description. For those
        talkgroups non-empty CSV Tag/Category/Description/Mode/Priority values
        also replace the current ones. Manually edited talkgroups are never
        overwritten; the CSV only fills their empty fields. Talkgroups first heard
        after the import pick up the CSV values on their first call or unit event.
        CSV modes other than D, A, E, M, T (e.g. `DE`, `TE`) are kept in the
        directory but not copied to the talkgroup.
      tags: [talkgroups]
      parameters:
        - name: system_id
          in: query
          description: Target system ID (must exist). Mutually exclusive with system_name.
          schema:
            type: integer
        - name: system_name
          in: query
          description: >-
            Target system name. Mutually exclusive with system_id. Selects the
            non-deleted system whose name, or one of whose sites' short name (TR's
            shortName), equals it exactly. The system must already exist: systems are
            created when trunk-recorder first reports them (MQTT, upload, file watch
            or TR_DIR), so an unknown name fails with 404 and nothing is created.
            If several systems match, the request fails with 409 and lists them;
            use system_id instead.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Talkgroup CSV file
      responses:
        "200":
          description: Import successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                    description: Number of talkgroups successfully imported
                  total:
                    type: integer
                    description: Total valid rows in the CSV
                  system_id:
                    type: integer
                    description: System ID the talkgroups were imported into
                  enriched:
                    type: integer
                    description: Heard talkgroups changed by applying the directory (omitted when 0)
                  skipped:
                    type: integer
                    description: Malformed rows or rows with a missing/invalid Decimal tgid (omitted when 0)
                  duplicates:
                    type: integer
                    description: Rows repeating a tgid seen earlier in the file; the last one wins (omitted when 0)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Units
  # ----------------------------------------------------------
  /unit-tags/import:
    post:
      operationId: importUnitTags
      x-scope: admin
      x-restricted: deny
      summary: Upload unit tags CSV
      description: |
        Imports a trunk-recorder unit tags CSV (the `unitTagsFile` format) into
        the units table, for deployments where tr-engine can't read trunk-recorder's
        files via `TR_DIR`. Accepts either `system_id` (must exist) or
        `system_name` (see the parameter).

        CSV format: two columns, `unit_id,alpha_tag`, no header required. A header
        row (first row whose first column is not numeric), a UTF-8 BOM, blank
        lines, quoted fields and extra columns are all accepted. Rows that can't be
        parsed, have a non-numeric or out-of-range unit ID (not 1..2147483647), or have an empty tag
        are counted in `skipped`. If a unit ID repeats, the last row wins.

        Tags are stored with `alpha_tag_source: csv` using the priority
        manual > csv > mqtt: they replace MQTT-discovered tags and previously
        imported CSV tags, and MQTT ingest will not change them afterwards.
        Manually edited units keep their tag. Units in the CSV that have not been
        heard yet are created with no first/last seen time. The file is applied
        in a single statement: either all rows are imported or, on a database
        error (500), none are.
      tags: [units]
      parameters:
        - name: system_id
          in: query
          description: Target system ID (must exist). Mutually exclusive with system_name.
          schema:
            type: integer
        - name: system_name
          in: query
          description: >-
            Target system name. Mutually exclusive with system_id. Selects the
            non-deleted system whose name, or one of whose sites' short name (TR's
            shortName), equals it exactly. The system must already exist: systems are
            created when trunk-recorder first reports them (MQTT, upload, file watch
            or TR_DIR), so an unknown name fails with 404 and nothing is created.
            If several systems match, the request fails with 409 and lists them;
            use system_id instead.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Unit tags CSV file (unit_id,alpha_tag)
      responses:
        "200":
          description: Import successful
          content:
            application/json:
              schema:
                type: object
                required: [imported, total, system_id, skipped]
                properties:
                  imported:
                    type: integer
                    description: Number of rows imported; always equals total, since the import is all-or-nothing (manually tagged units are counted but keep their tag)
                  total:
                    type: integer
                    description: Total valid rows in the CSV
                  system_id:
                    type: integer
                    description: System ID the unit tags were imported into
                  skipped:
                    type: integer
                    description: Rows skipped as malformed, with an invalid unit ID, or with an empty tag
                  duplicates:
                    type: integer
                    description: Rows repeating a unit ID seen earlier in the file; the last one wins (omitted when 0)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /units:
    get:
      operationId: listUnits
      x-scope: listen
      x-restricted: deny
      summary: List radio units
      description: |
        Returns radio units with optional filters. When searching, results
        include relevance_score (100=exact, 50=prefix, 10=contains).
      tags: [units]
      parameters:
        - name: sysid
          in: query
          description: Filter by P25 SYSID
          schema:
            type: string
        - name: search
          in: query
          description: Search by alpha_tag or unit_id
          schema:
            type: string
        - name: active_within
          in: query
          description: |
            Only return units active within this many minutes. Replaces the
            need for a separate "active units" endpoint when combined with
            other filters.
          schema:
            type: integer
        - name: talkgroup
          in: query
          description: Filter by talkgroup ID (comma-separated for multiple)
          schema:
            type: string
            example: "9178,5344"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/sortDir"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /units/{id}:
    get:
      operationId: getUnit
      x-scope: listen
      x-restricted: deny
      summary: Get a unit
      description: |
        Returns a single unit. Accepts composite `system_id:unit_id` (e.g.,
        "1:1234567") or plain `unit_id`. Returns 409 if ambiguous.
      tags: [units]
      parameters:
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateUnit
      x-scope: edit
      x-restricted: deny
      summary: Update unit metadata
      description: >-
        Updates mutable unit fields (alpha_tag, alpha_tag_source).
        Setting a non-empty alpha_tag marks the unit `alpha_tag_source: manual`
        (any alpha_tag_source in the same request is ignored), so neither MQTT
        ingest nor a unit tags CSV re-import will overwrite the edit. An empty
        alpha_tag is ignored: it neither clears the tag nor marks it manual. An
        unknown alpha_tag_source value is rejected with 400.
        When CSV_WRITEBACK is enabled and TR_DIR is configured with a unitTagsFile,
        alpha_tag changes are also written back to trunk-recorder's unit CSV file on disk.
      tags: [units]
      parameters:
        - $ref: "#/components/parameters/unitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /units/{id}/calls:
    get:
      operationId: listUnitCalls
      x-scope: listen
      x-restricted: deny
      summary: List calls for a unit
      description: |
        Returns calls that include transmissions from a specific unit.
        Accepts composite `system_id:unit_id` or plain `unit_id`.
      tags: [units]
      parameters:
        - $ref: "#/components/parameters/unitId"
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  /units/{id}/events:
    get:
      operationId: listUnitEvents
      x-scope: listen
      x-restricted: deny
      summary: List unit events
      description: |
        Returns events (affiliations, registrations, calls, etc.) for a
        specific unit. Includes embedded talkgroup and unit display names.
      tags: [units]
      parameters:
        - $ref: "#/components/parameters/unitId"
        - name: type
          in: query
          description: Filter by event type
          schema:
            $ref: "#/components/schemas/EventType"
        - name: talkgroup
          in: query
          description: Filter by talkgroup ID
          schema:
            type: integer
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitEventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Ambiguous"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Unit Tag Suggestions (review queue)
  # ----------------------------------------------------------
  /unit-tag-suggestions:
    get:
      operationId: listUnitTagSuggestions
      x-scope: listen
      x-restricted: deny
      summary: List unit alpha tag suggestions
      description: |
        Returns candidate unit alpha tags extracted from transcriptions where
        a unit identified itself (e.g. "County, Medic 12 on scene"). Only the
        unit's own speech is used (word-level attribution against the call's
        `src_list`); transcriptions without attribution are skipped unless
        every transmission in the call came from the same unit.

        Only unit designators are extracted ("Medic 12", "Battalion Chief 2",
        "P338", "1 Paul 31", "Adam 12"), never personal names, and only from a
        call's primary (current) transcription. A transmission recorded by
        several sites (one call group) counts as one call.

        Candidates are keyed by `(system_id, unit_id, tag_key)` and accumulate
        evidence across calls. **Pending** suggestions are only listed once they
        pass the review gate: seen in at least `UNIT_TAG_SUGGESTIONS_MIN_CALLS`
        distinct calls (default 3), at least `UNIT_TAG_SUGGESTIONS_MIN_SHARE`
        (default 0.2) of the unit's self-identification calls, and not already
        the unit's alpha tag. The gate applies to pending rows for every
        `status` value; approved and dismissed rows are always listed.

        Pending results are grouped by unit (busiest units first, then each
        unit's candidates by `call_count`); approved/dismissed results are
        ordered by decision time, newest first. The endpoint works whether or
        not the background scanner is enabled — `scanner.enabled` reports it.
      tags: [unit-tag-suggestions]
      parameters:
        - name: status
          in: query
          description: Filter by review status (`all` = every status).
          schema:
            type: string
            enum: [pending, approved, dismissed, all]
            default: pending
        - name: system_id
          in: query
          description: Filter by system ID (comma-separated for multiple). Alias `systems`.
          schema:
            type: string
            example: "1,2"
        - name: unit_id
          in: query
          description: Filter by radio unit ID (comma-separated for multiple). Alias `units`.
          schema:
            type: string
            example: "1234567"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitTagSuggestionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /unit-tag-suggestions/{id}:
    get:
      operationId: getUnitTagSuggestion
      x-scope: listen
      x-restricted: deny
      summary: Get a unit alpha tag suggestion
      description: Returns one suggestion by ID regardless of status or review gate.
      tags: [unit-tag-suggestions]
      parameters:
        - $ref: "#/components/parameters/suggestionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitTagSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /unit-tag-suggestions/{id}/approve:
    post:
      operationId: approveUnitTagSuggestion
      x-scope: edit
      x-restricted: deny
      summary: Approve a unit alpha tag suggestion
      description: |
        Applies a **pending** suggestion to its unit and marks it `approved`.
        The optional body overrides the proposed tag ("edit, then approve");
        without it the suggestion's `proposed_tag` is applied.

        The unit is updated through the same path as `PATCH /units/{id}`
        with `alpha_tag_source` set to `manual` (a person explicitly chose the
        tag, so MQTT and CSV re-imports will not overwrite it), including the
        best-effort CSV writeback when `CSV_WRITEBACK` is enabled. The unit's
        previous tag and source are recorded on the suggestion
        (`previous_tag`, `previous_tag_source`) with `decided_by`/`decided_at`.
        Other suggestions for the same unit are left untouched. Requires the
        `edit` scope (same as `PATCH /units/{id}`).
      tags: [unit-tag-suggestions]
      parameters:
        - $ref: "#/components/parameters/suggestionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitTagSuggestionApprove"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitTagSuggestionApproveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Suggestion (or its unit) not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/SuggestionNotPending"
        "500":
          $ref: "#/components/responses/InternalError"

  /unit-tag-suggestions/{id}/dismiss:
    post:
      operationId: dismissUnitTagSuggestion
      x-scope: edit
      x-restricted: deny
      summary: Dismiss a unit alpha tag suggestion
      description: |
        Marks a **pending** suggestion `dismissed` without touching the unit.
        A dismissed candidate keeps accumulating evidence when seen again but
        never returns to the pending queue. No request body. Requires the
        `edit` scope (same as `PATCH /units/{id}`).
      tags: [unit-tag-suggestions]
      parameters:
        - $ref: "#/components/parameters/suggestionId"
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitTagSuggestionDismissResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SuggestionNotPending"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Unit Events (system-wide)
  # ----------------------------------------------------------
  /unit-events:
    get:
      operationId: listUnitEventsGlobal
      x-scope: listen
      x-restricted: deny
      summary: List unit events (system-wide)
      description: |
        Returns unit events across an entire system with JOINs for display
        names. Supports multi-type filtering and optional emergency filter.
        Default lookback is 1 hour; max time range is 24 hours.

        **At least one of `system_id` or `sysid` is required.** Returns 400
        if neither is provided.
      tags: [units]
      parameters:
        - name: system_id
          in: query
          description: |
            Filter by internal system ID (comma-separated for multiple).
            Alias "systems" also accepted. **Required** unless `sysid` is provided.
          schema:
            type: string
            example: "1,2"
        - name: sysid
          in: query
          description: |
            Filter by P25 sysid hex (comma-separated for multiple).
            Alias "sysids" also accepted. **Required** unless `system_id` is provided.
          schema:
            type: string
        - name: unit_id
          in: query
          description: Filter by unit radio ID (comma-separated for multiple). Aliases "units", "unit_ids" also accepted.
          schema:
            type: string
            example: "924003,104"
        - name: type
          in: query
          description: |
            Comma-separated event types to include (e.g. `join,on,off`).
            If omitted, all event types are returned.
          schema:
            type: string
        - name: tgid
          in: query
          description: Filter by talkgroup ID (comma-separated for multiple). Alias "tgids" also accepted.
          schema:
            type: string
            example: "9178,5344"
        - name: emergency
          in: query
          description: Filter by emergency flag
          schema:
            type: boolean
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - name: sort
          in: query
          description: |
            Sort field with optional `-` prefix for descending.
            Allowed: `time`, `unit_rid`, `tgid`, `event_type`. Default: `-time`.
          schema:
            type: string
            default: "-time"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitEventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Unit Affiliations (live in-memory state)
  # ----------------------------------------------------------
  /unit-affiliations:
    get:
      operationId: listUnitAffiliations
      x-scope: listen
      x-restricted: deny
      summary: List live talkgroup affiliations
      description: |
        Returns current talkgroup affiliation state for units, derived from
        live MQTT `join` and `off` events. This is a live endpoint — data
        is served from memory, not the database. The map starts empty on
        boot and populates from live traffic.

        Each entry shows which talkgroup a unit is currently affiliated with,
        when the affiliation started, and the unit's status (`affiliated` or `off`).
      tags: [units]
      parameters:
        - name: system_id
          in: query
          description: Filter by internal system ID (comma-separated for multiple)
          schema:
            type: string
            example: "1,2"
        - name: sysid
          in: query
          description: Filter by P25 sysid hex (comma-separated for multiple)
          schema:
            type: string
        - name: tgid
          in: query
          description: Filter by talkgroup ID (comma-separated for multiple)
          schema:
            type: string
            example: "9178,5344"
        - name: unit_id
          in: query
          description: Filter by unit radio ID (comma-separated for multiple)
          schema:
            type: string
            example: "924003,104"
        - name: status
          in: query
          description: Filter by status (`affiliated` or `off`)
          schema:
            type: string
            enum: [affiliated, "off"]
        - name: stale_threshold
          in: query
          description: |
            Exclude entries whose last event is older than this many seconds.
          schema:
            type: integer
        - name: active_within
          in: query
          description: |
            Only include entries active within this many seconds.
          schema:
            type: integer
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Calls
  # ----------------------------------------------------------
  /calls:
    get:
      operationId: listCalls
      x-scope: listen
      x-restricted: enforced
      summary: List calls
      description: |
        Returns call recordings with comprehensive filters. This is the
        primary endpoint for querying call history.

        **Common patterns:**
        - Live feed: `?sort=-stop_time&deduplicate=true&limit=50`
        - Talkgroup history: `?tgid=9178&sysid=348&start_time=...&end_time=...`
        - Unit activity: `?unit_id=924003`
        - Emergency calls: `?emergency=true&sort=-start_time`
      tags: [calls]
      parameters:
        - name: sysid
          in: query
          description: Filter by P25 SYSID (comma-separated for multiple, e.g., "348,34D"). Alias "sysids" also accepted.
          schema:
            type: string
        - name: system_id
          in: query
          description: Filter by system database ID (comma-separated for multiple). Alias "systems" also accepted.
          schema:
            type: string
            example: "1,2"
        - name: site_id
          in: query
          description: Filter by recording site ID (comma-separated for multiple). Alias "sites" also accepted.
          schema:
            type: string
            example: "1,3"
        - name: tgid
          in: query
          description: Filter by talkgroup ID (comma-separated for multiple). Alias "tgids" also accepted.
          schema:
            type: string
            example: "9178,5344"
        - name: unit_id
          in: query
          description: Filter by unit radio ID (comma-separated for multiple). Aliases "units", "unit_ids" also accepted.
          schema:
            type: string
            example: "924003,104"
        - name: emergency
          in: query
          description: Filter by emergency flag
          schema:
            type: boolean
        - name: encrypted
          in: query
          description: Filter by encryption status
          schema:
            type: boolean
        - name: deduplicate
          in: query
          description: |
            When true, returns one call per call_group (best recording).
            Useful for feed views where simulcast duplicates are unwanted.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - name: sort
          in: query
          description: |
            Sort field. Prefix with `-` for descending.
            Allowed: start_time, stop_time, duration, tgid, freq
          schema:
            type: string
            default: "-start_time"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /calls/active:
    get:
      operationId: listActiveCalls
      x-scope: listen
      x-restricted: enforced
      summary: List active calls (real-time)
      description: |
        Returns currently active calls from the in-memory MQTT tracker.
        This is a live endpoint — it returns a point-in-time snapshot of
        all active calls from memory. There is no pagination; the full
        list is returned in a single response.

        Active calls may have incomplete fields (no stop_time, no audio_url,
        duration is elapsed-so-far). The response uses the same Call schema
        with nullable fields where data is not yet available.
      tags: [calls]
      parameters:
        - name: sysid
          in: query
          description: Filter by P25 SYSID
          schema:
            type: string
        - name: tgid
          in: query
          description: Filter by talkgroup ID
          schema:
            type: integer
        - name: emergency
          in: query
          description: Filter by emergency flag
          schema:
            type: boolean
        - name: encrypted
          in: query
          description: Filter by encryption status
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveCallListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /calls/{id}:
    get:
      operationId: getCall
      x-scope: listen
      x-restricted: enforced
      summary: Get a call
      description: |
        Returns a single call recording by its database ID.
      tags: [calls]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /calls/{id}/audio:
    get:
      operationId: getCallAudio
      x-scope: listen
      x-restricted: enforced
      summary: Stream call audio
      description: |
        Streams the audio file for a call. Content-Type varies by source
        format. Responses carry `Cache-Control: private`.

        **Authentication:** `Authorization: Bearer <key>` when the client
        can send headers, `?ticket=<ticket>` from `POST /tickets` for an
        `<audio src>` element (which cannot), or no credential when the
        anonymous access policy is `listen`. An audio element makes
        repeated (Range) requests with the same URL; a ticket stays valid
        for all of them until it expires, so mint one with some lifetime
        left (for example at least 5 minutes) and mint a new one if
        playback fails with an error.

        A call outside a restricted credential's restriction is 404.

        `audio_url` fields in API responses hold this path and never a
        credential; see `Call.audio_url`.
      tags: [calls]
      security:
        - bearerAuth: []
        - ticketAuth: []
      parameters:
        - $ref: "#/components/parameters/callId"
        - $ref: "#/components/parameters/ticket"
      responses:
        "200":
          description: Audio stream
          headers:
            Cache-Control:
              schema:
                type: string
                example: private
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /calls/{id}/frequencies:
    get:
      operationId: getCallFrequencies
      x-scope: listen
      x-restricted: enforced
      summary: Get call frequency list
      description: |
        Returns the frequency entries (freqList) within a call, ordered by
        position in the audio, paged with `limit`/`offset` (`total` counts
        every entry). A `limit` that isn't an integer ≥ 1 or an `offset`
        that isn't an integer ≥ 0 is 400 `invalid_parameter`.
      tags: [calls]
      parameters:
        - $ref: "#/components/parameters/callId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallFrequencyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /calls/{id}/transmissions:
    get:
      operationId: getCallTransmissions
      x-scope: listen
      x-restricted: enforced
      summary: Get call transmission list
      description: |
        Returns the unit transmissions (srcList) within a call, ordered by
        position in the audio. Each entry represents a unit keying up.
        Includes unit alpha_tags. Paged with `limit`/`offset` (`total`
        counts every entry). A `limit` that isn't an integer ≥ 1 or an
        `offset` that isn't an integer ≥ 0 is 400 `invalid_parameter`.
      tags: [calls]
      parameters:
        - $ref: "#/components/parameters/callId"
        - $ref: "#/components/parameters/limit"
