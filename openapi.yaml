  # ----------------------------------------------------------
  # Transcriptions
  # ----------------------------------------------------------
  /calls/{id}/transcription:
    get:
      operationId: getCallTranscription
      x-scope: listen
      x-restricted: enforced
      summary: Get primary transcription for a call
      description: Returns the current primary transcription with unit-attributed word timestamps and segments.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: submitTranscriptionCorrection
      x-scope: edit
      x-restricted: deny
      summary: Submit transcription
      description: |
        Creates a new primary transcription variant for a call. Defaults to
        source "human" for backward compatibility, but callers can supply
        source, provider, language, and pre-built word/segment data for
        source-side or programmatic transcriptions.

        `source` must be `auto`, `human` or `llm` (case-sensitive); any
        other value is 400 `invalid_body` ("source must be one of auto,
        human, llm"). The new primary transcription sets the call's and
        its call group's `transcription_status`: `verified` for `human`,
        `auto` for `auto` and `llm`.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Transcription text
                source:
                  allOf:
                    - $ref: "#/components/schemas/TranscriptionSource"
                  default: human
                  description: |
                    Transcription source: `auto`, `human` or `llm`.
                    Defaults to `human` if omitted; any other value is 400
                    `invalid_body`.
                  example: human
                provider:
                  type: string
                  description: Provider identifier (e.g., "client-whisper", "elevenlabs")
                  example: client-whisper
                language:
                  type: string
                  description: Language code
                  example: en
                words:
                  type: object
                  nullable: true
                  description: |
                    Optional pre-built word/segment data. Same structure as the
                    `words` field in the Transcription schema.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  call_id:
                    type: integer
                  source:
                    type: string
                    example: human
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calls/{id}/transcriptions:
    get:
      operationId: listCallTranscriptions
      x-scope: listen
      x-restricted: enforced
      summary: List all transcription variants for a call
      description: |
        Returns all transcription variants (auto, human, LLM) for a call.
        The primary variant is marked with `is_primary: true`.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transcription"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calls/{id}/transcribe:
    post:
      operationId: transcribeCall
      x-scope: edit
      x-restricted: deny
      summary: Queue call for transcription
      description: Queues a call for transcription (or re-transcription). Returns 202 if accepted.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "202":
          description: Accepted — queued for transcription
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_id:
                    type: integer
                  status:
                    type: string
                    enum: [queued]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Transcription queue full or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /calls/{id}/transcription/verify:
    post:
      operationId: verifyTranscription
      x-scope: edit
      x-restricted: deny
      summary: Verify a transcription
      description: Marks the call's current transcription as human-verified.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calls/{id}/transcription/reject:
    post:
      operationId: rejectTranscription
      x-scope: edit
      x-restricted: deny
      summary: Reject a transcription
      description: Resets the call's transcription_status to "reviewed" (unverified).
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /calls/{id}/transcription/exclude:
    post:
      operationId: excludeFromDataset
      x-scope: edit
      x-restricted: deny
      summary: Exclude call from training dataset
      description: Marks a call as permanently excluded from the training dataset.
      tags: [transcriptions]
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /transcriptions/search:
    get:
      operationId: searchTranscriptions
      x-scope: listen
      x-restricted: enforced
      summary: Full-text search across transcriptions
      description: |
        Searches transcription text using PostgreSQL full-text search.
        Results include call context (talkgroup, system, timing) so no
        follow-up lookups are needed.
      tags: [transcriptions]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
        - name: system_id
          in: query
          description: Filter by system ID(s), comma-separated. Alias "systems" also accepted.
          schema:
            type: string
        - name: tgid
          in: query
          description: Filter by talkgroup ID(s), comma-separated. Alias "tgids" also accepted.
          schema:
            type: string
        - name: site_id
          in: query
          description: Filter by site ID(s), comma-separated. Alias "sites" also accepted.
          schema:
            type: string
        - name: start_time
          in: query
          description: Start of time range (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: End of time range (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: primary_only
          in: query
          description: When true, only return the primary transcription for each call
          schema:
            type: boolean
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transcriptions/batch:
    get:
      operationId: getBatchTranscriptions
      x-scope: listen
      x-restricted: enforced
      summary: Batch-fetch primary transcriptions for multiple calls
      description: |
        Returns the primary transcription text and segments for up to 500 call IDs
        in a single request. Designed for frontends that need to hydrate transcriptions
        for a list of calls (e.g., chat-style views). Returns only call_id, text, and
        segments (from words->'segments') — use GET /calls/{id}/transcription for
        full transcription details.
      tags: [transcriptions]
      parameters:
        - name: call_ids
          in: query
          required: true
          description: Comma-separated list of call IDs (max 500).
          schema:
            type: string
            example: "48531,48532,48533"
      responses:
        "200":
          description: Batch transcription results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchTranscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transcriptions/queue:
    get:
      operationId: getTranscriptionQueueStatus
      x-scope: listen
      x-restricted: deny
      summary: Get transcription queue status
      description: Returns statistics about the transcription processing queue.
      tags: [transcriptions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionQueueStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ----------------------------------------------------------
  # Call Upload
  # ----------------------------------------------------------
  /call-upload:
    post:
      operationId: uploadCall
      x-scope: upload
      x-restricted: deny
      summary: Upload a call recording
      security:
        - bearerAuth: []
      description: |
        Accepts multipart/form-data uploads compatible with trunk-recorder's
        rdio-scanner and OpenMHz upload plugins. Auto-detects format from form
        field names.

        This provides a third ingest path alongside MQTT and file-watch. Point
        trunk-recorder's upload plugin at `POST /api/v1/call-upload` and it
        works out of the box.

        **Authentication:** needs an API key with the `upload` scope
        (create one with `tr-engine keys create --name "tr butco uploads"
        --scopes upload`). Anonymous access never allows uploads, and
        `listen`/`edit`/`admin` keys without `upload` are refused with 403
        `insufficient_scope`. The key is read from, in order:

        1. the `Authorization: Bearer <key>` header;
        2. the multipart form field `key` (rdio-scanner plugin);
        3. the multipart form field `api_key` (OpenMHz plugin).

        Form fields are read from the multipart body only (never from the
        URL), after the 50 MB upload size limit (a larger body is 413,
        whether the key is in the header or the form). A field that is
        present but holds an unknown, revoked or expired key is 401
        `invalid_key`; the other field is not tried. Without a Bearer
        header, a body that isn't `multipart/form-data` has no key fields
        and is 401 `key_required`, and so is a form field holding the
        pre-upgrade public `AUTH_TOKEN` (it counts as no key). Rejected
        uploads are logged with the client IP, the form's system name and
        the reason.

        **Rate limits:** an upload that carries its key in a form field
        has no header credential, so it is limited per client IP
        (`RATE_LIMIT_RPS`/`RATE_LIMIT_BURST`) like a request without a
        key. It costs two per-IP tokens when the key isn't in the
        30-second key cache, and always for a legacy (imported) key such
        as an imported `WRITE_TOKEN`, so those uploads get half the
        per-IP rate. A host that uploads many calls per second (for
        example while clearing a backlog) should send the key as
        `Authorization: Bearer` (a legacy key stays limited per IP there
        too, at one token per request; replace it with a new `upload`
        key), or the operator should raise the per-IP limits.

        **Format detection:** The endpoint inspects form field names to
        determine the upload format:
        - Fields `audio`, `audioName`, or `systemLabel` → **rdio-scanner** format
        - Fields `call`, `talkgroup_num`, or `start_time` → **OpenMHz** format

        **rdio-scanner format fields:**

        | Field | Type | Required | Description |
        |-------|------|----------|-------------|
        | `audio` | file | Yes | Audio file (m4a, wav, mp3) |
        | `talkgroup` | integer | Yes | Talkgroup ID |
        | `dateTime` | integer | Yes | Unix epoch timestamp |
        | `systemLabel` | string | Yes | System short name (used for identity resolution) |
        | `frequency` | integer | No | Frequency in Hz |
        | `sources` | JSON string | No | Array of `[{pos, src, tag}]` source items |
        | `frequencies` | JSON string | No | Array of `[{freq, time, pos, len, errors, spikes}]` |
        | `talkgroupLabel` | string | No | Talkgroup alpha tag |
        | `talkgroupName` | string | No | Talkgroup description |
        | `talkgroupTag` | string | No | Talkgroup service tag |
        | `talkgroupGroup` | string | No | Talkgroup group/category |
        | `audioType` | string | No | MIME type (e.g., `audio/mp4`) |
        | `audioName` | string | No | Original filename |
        | `emergency` | boolean | No | Emergency flag |
        | `encrypted` | boolean | No | Encrypted flag |
        | `key` | string | No | API key with the `upload` scope (alternative to the Bearer header) |

        **OpenMHz format fields:**

        | Field | Type | Required | Description |
        |-------|------|----------|-------------|
        | `call` | file | Yes | Audio file |
        | `talkgroup_num` | integer | Yes | Talkgroup ID |
        | `start_time` | integer | Yes | Unix epoch start time |
        | `freq` | integer | No | Frequency in Hz |
        | `stop_time` | integer | No | Unix epoch stop time |
        | `call_length` | number | No | Call duration in seconds |
        | `source_list` | JSON string | No | Array of source items |
        | `emergency` | integer | No | Emergency flag (0/1) |
        | `error_count` | integer | No | Decode error count |
        | `api_key` | string | No | API key with the `upload` scope (alternative to the Bearer header) |
      tags: [calls]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: |
                Form fields depend on the upload format (rdio-scanner or OpenMHz).
                See endpoint description for the complete field reference.
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (rdio-scanner format)
                call:
                  type: string
                  format: binary
                  description: Audio file (OpenMHz format)
                talkgroup:
                  type: integer
                  description: Talkgroup ID (rdio-scanner format)
                talkgroup_num:
                  type: integer
                  description: Talkgroup ID (OpenMHz format)
                dateTime:
                  type: integer
                  format: int64
                  description: Unix epoch timestamp (rdio-scanner format)
                start_time:
                  type: integer
                  format: int64
                  description: Unix epoch start time (OpenMHz format)
                systemLabel:
                  type: string
                  description: System short name (rdio-scanner format)
                frequency:
                  type: integer
                  description: Frequency in Hz (rdio-scanner format)
                freq:
                  type: integer
                  description: Frequency in Hz (OpenMHz format)
                stop_time:
                  type: integer
                  format: int64
                  description: Unix epoch stop time (OpenMHz format)
                sources:
                  type: string
                  description: JSON array of source items (rdio-scanner format)
                source_list:
                  type: string
                  description: JSON array of source items (OpenMHz format)
                frequencies:
                  type: string
                  description: JSON array of frequency items (rdio-scanner format)
                talkgroupLabel:
                  type: string
                  description: Talkgroup alpha tag
                talkgroupName:
                  type: string
                  description: Talkgroup description
                talkgroupTag:
                  type: string
                  description: Talkgroup service tag
                talkgroupGroup:
                  type: string
                  description: Talkgroup group/category
                audioType:
                  type: string
                  description: Audio MIME type (e.g., audio/mp4)
                audioName:
                  type: string
                  description: Original audio filename
                emergency:
                  type: string
                  description: Emergency flag (boolean or 0/1)
                encrypted:
                  type: string
                  description: Encrypted flag (boolean or 0/1)
                error_count:
                  type: integer
                  description: Decode error count (OpenMHz format)
                call_length:
                  type: number
                  description: Call duration in seconds (OpenMHz format)
                key:
                  type: string
                  description: API key with the `upload` scope (rdio-scanner format; alternative to the Bearer header)
                api_key:
                  type: string
                  description: API key with the `upload` scope (OpenMHz format; alternative to the Bearer header)
      responses:
        "201":
          description: Created — call record created and audio saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_id:
                    type: integer
                    format: int64
                    description: Database ID of the created call
                    example: 48531
                  system_id:
                    type: integer
                    description: System the call was assigned to
                    example: 1
                  tgid:
                    type: integer
                    description: Talkgroup ID
                    example: 9044
                  start_time:
                    type: string
                    format: date-time
                    description: Call start time (RFC 3339)
                  audio_file_path:
                    type: string
                    description: |
                      Relative path of the saved audio file:
                      `upload/<system_id>/<YYYY-MM-DD>/<call_id>.<ext>`
                      (UTC date of the start time), with `ext` one of
                      `m4a`, `mp3`, `wav`, `ogg` or `bin`, taken from
                      `audioType` or the uploaded file's name (nothing
                      declared means `m4a`). Every part is chosen by the
                      engine, and an upload never overwrites a stored
                      file: if one already exists under that name, a
                      random suffix is added (`<call_id>-<hex>.<ext>`).
                      Empty when no audio was saved.
                    example: "upload/1/2024-02-25/48531.m4a"
        "400":
          description: |
            Bad Request — an unrecognized format (`bad_request`), or
            `invalid_body` for missing or malformed required fields, and
            for:
            - a system short name containing `/`, `\`, `..` or control
              characters, or longer than 128 bytes;
            - a talkgroup that is not positive;
            - a missing or non-positive start time (`dateTime` /
              `start_time`);
            - a start time more than 10 minutes in the future;
            - a start time in a month that has no partition yet and lies
              outside the months the engine creates partitions for on
              demand (12 months back to 3 months ahead of now).

            With a Bearer key, also a body that is not valid
            multipart/form-data (`invalid_body`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict — duplicate call (same system, talkgroup, and start time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Payload Too Large — the body is over the 50 MB upload limit (key in the header or in the form)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: bad_request
                error: request body too large
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

