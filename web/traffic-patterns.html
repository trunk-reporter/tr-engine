<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth.js?v=3"></script>
<meta name="card-title" content="Traffic & Patterns">
<meta name="card-description" content="Network traffic patterns, peak hours, and top talkgroup analysis">
<meta name="card-order" content="5">
<title>Traffic &amp; Patterns — tr-engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Karla:wght@200;300;400;500&family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="theme-config.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  font-weight: var(--font-weight-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.5s, color 0.4s;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: var(--grid-bg);
  background-size: var(--grid-size) var(--grid-size);
  opacity: 0.4;
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: var(--scanlines);
}
.vignette-overlay {
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
  background: var(--vignette); transition: background 0.6s;
}

.wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 80px 28px 56px; }

/* ── Header ── */
.header-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 14px 20px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: var(--radius); backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--shadow-panel); margin-bottom: 24px;
}
.header-bar h1 {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
}
.header-bar select {
  background: var(--tile-bg); border: 1px solid var(--tile-border);
  border-radius: var(--radius-xs); color: var(--text);
  font-family: var(--font-mono); font-size: 12px; padding: 6px 10px;
  outline: none; min-width: 180px;
  transition: border-color 0.2s;
}
.header-bar select:focus { border-color: var(--accent); }

/* ── Summary Tiles ── */
.summary-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px; margin-bottom: 28px;
}
.summary-tile {
  padding: 20px; border-radius: var(--radius);
  background: var(--tile-bg); border: 1px solid var(--tile-border);
  box-shadow: var(--shadow-panel); transition: box-shadow 0.2s, border-color 0.2s;
}
.summary-tile:hover { box-shadow: var(--shadow-panel-hover); border-color: var(--border-hover); }
.summary-tile .tile-label {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px;
}
.summary-tile .tile-value {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.summary-tile .tile-sub {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 4px;
}

/* ── Sections ── */
.section { margin-bottom: 32px; }
.section-header {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.section-title {
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
}
.section-subtitle {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
}

/* ── Charts ── */
.chart-container {
  background: var(--tile-bg); border: 1px solid var(--tile-border);
  border-radius: var(--radius); padding: 16px; min-height: 300px;
  box-shadow: var(--shadow-panel);
}
.chart-container canvas { width: 100% !important; }

/* ── Table ── */
.data-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--tile-bg); border: 1px solid var(--tile-border);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-panel);
}
.data-table thead th {
  background: color-mix(in srgb, var(--accent) 8%, var(--tile-bg));
  border-bottom: 2px solid var(--accent-dim);
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-mid); font-weight: 600;
  padding: 12px 14px; text-align: left; white-space: nowrap;
}
.data-table tbody tr {
  border-bottom: 1px solid var(--tile-border);
  transition: background 0.15s;
}
.data-table tbody tr:nth-child(even) { background: color-mix(in srgb, var(--tile-bg), white 3%); }
.data-table tbody tr:hover { background: var(--accent-glow); }
.data-table tbody td {
  padding: 10px 14px; font-family: var(--font-mono); font-size: 12px;
  color: var(--text); white-space: nowrap;
}
.data-table tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
}
.pill-danger {
  background: color-mix(in srgb, var(--danger), transparent 85%);
  border: 1px solid color-mix(in srgb, var(--danger), transparent 60%);
  color: var(--danger);
}
.pill-default {
  background: color-mix(in srgb, var(--bg-elevated), transparent);
  border: 1px solid var(--tile-border);
  color: var(--text-muted);
}

.chart-loading {
  display: flex; align-items: center; justify-content: center;
  min-height: 280px; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px;
}
.error-card {
  background: color-mix(in srgb, var(--danger), transparent 92%);
  border: 1px solid color-mix(in srgb, var(--danger), transparent 60%);
  color: var(--danger); padding: 20px; border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 13px; margin-bottom: 24px;
}
.theme-label {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10000; font-family: var(--font-display); font-size: 11px;
  letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px);
  border: 1px solid var(--border); padding: 8px 20px; border-radius: 100px;
  transition: all 0.5s; pointer-events: none; opacity: 0;
}
.theme-label.show { opacity: 1; }

@media (max-width: 768px) {
  .wrap { padding: 72px 12px 32px; }
  .summary-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .summary-tile .tile-value { font-size: 22px; }
  .header-bar { padding: 10px 14px; }
  .data-table { font-size: 11px; }
  .data-table td, .data-table th { padding: 8px 10px; }
}
</style>
</head>
<body>
<div class="vignette-overlay"></div>

<div class="wrap">
  <div class="header-bar">
    <h1>Traffic &amp; Patterns</h1>
    <select id="sys-select" title="Select system"><option value="">All Systems</option></select>
  </div>

  <div id="error-panel"></div>

  <div class="summary-row">
    <div class="summary-tile">
      <div class="tile-label">Total Calls (30d)</div>
      <div class="tile-value" id="stat-calls">—</div>
    </div>
    <div class="summary-tile">
      <div class="tile-label">Active Talkgroups (30d)</div>
      <div class="tile-value" id="stat-tg">—</div>
      <div class="tile-sub" id="stat-tg-sub"></div>
    </div>
    <div class="summary-tile">
      <div class="tile-label">Total Audio</div>
      <div class="tile-value" id="stat-audio">—</div>
    </div>
    <div class="summary-tile">
      <div class="tile-label">Peak Hour</div>
      <div class="tile-value" id="stat-peak">—</div>
      <div class="tile-sub" id="stat-peak-sub"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Traffic Heatmap</span>
      <span class="section-subtitle">calls by day of week &amp; hour</span>
    </div>
    <div class="chart-container"><div id="heatmap-chart" style="width:100%;height:340px;"></div></div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Daily Trend</span>
      <span class="section-subtitle">calls per day over last 30 days</span>
    </div>
    <div class="chart-container"><div id="trend-chart" style="width:100%;height:300px;"></div></div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Top Talkgroups</span>
      <span class="section-subtitle">ranked by call count — last 30 days</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr>
          <th>#</th><th>TGID</th><th>Alpha Tag</th><th>Tags</th><th>Group</th>
          <th style="text-align:right">Calls</th><th style="text-align:right">Audio (min)</th>
          <th style="text-align:right">Emerg.</th>
        </tr></thead>
        <tbody id="tg-body"><tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px;">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="theme-label" id="themeLabel"></div>

<script src="theme-engine.js?v=2"></script>
<script>
(function() {
  'use strict';

  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  document.getElementById('themeLabel').addEventListener('transitionend', function() {
    var self = this;
    setTimeout(function() { self.classList.remove('show'); }, 1800);
  });

  var heatmapChart, trendChart;
  var errorPanel = document.getElementById('error-panel');
  var sysSelect = document.getElementById('sys-select');

  function apiFetch(path) {
    return fetch('/api/v1' + path).then(function(r) { return r.json(); });
  }

  function formatNum(n) {
    if (n == null) return '—';
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function formatDurationHours(h) {
    if (!h) return '—';
    var hours = Math.floor(h);
    var mins = Math.round((h - hours) * 60);
    if (hours > 0 && mins > 0) return hours + 'h ' + mins + 'm';
    if (hours > 0) return hours + 'h';
    return mins + 'm';
  }

  function loadTime(dt) {
    if (!dt) return '—';
    var d = new Date(dt);
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  var esc = function(s) { return trAuth.escapeHTML(s); };

  function loadError(msg) {
    errorPanel.innerHTML = '<div class="error-card">Failed to load data: ' + esc(msg) + '</div>';
  }

  function loadHeatmapData(hours) {
    return apiFetch('/stats/call-heatmap?days=' + Math.min(hours ? Math.round(hours / 24) : 30, 90)).then(function(raw) {
      var cells = raw.cells || raw.data || [];
      var counts = {};
      var totalCalls = 0, peakHour = { hour: 0, count: 0 };
      var hourTotals = new Array(24).fill(0);
      cells.forEach(function(c) {
        var key = c.dow + ',' + c.hour;
        counts[key] = c.calls;
        totalCalls += c.calls;
        hourTotals[c.hour] += c.calls;
        if (c.calls > peakHour.count) peakHour = { hour: c.hour, count: c.calls };
      });
      return { counts: counts, totalCalls: totalCalls, peakHour: peakHour, hourTotals: hourTotals };
    });
  }

  function loadDailyTrend(days) {
    return apiFetch('/stats/daily-overview?days=' + (days || 30)).then(function(raw) {
      return { rows: raw.rows || [], totalCalls: (raw.rows || []).reduce(function(s,r) { return s + r.calls; }, 0) };
    });
  }

  function loadTalkgroupActivity(days, systemId) {
    var p = '/stats/talkgroup-activity?limit=50&days=' + (days || 30) + '&sort=call_count';
    if (systemId) p += '&system_id=' + systemId;
    return apiFetch(p).then(function(raw) { return { activity: raw.activity || [], total: raw.total || 0 }; });
  }

  function loadSystems() {
    return apiFetch('/systems').then(function(raw) { return raw.systems || []; });
  }

  function renderHeatmapChart(data) {
    if (!heatmapChart) heatmapChart = echarts.init(document.getElementById('heatmap-chart'));
    var matrix = [];
    var maxCalls = 0;
    for (var d = 0; d < 7; d++) {
      for (var h = 0; h < 24; h++) {
        var v = data.counts[d + ',' + h] || 0;
        matrix.push([h, d, v]);
        if (v > maxCalls) maxCalls = v;
      }
    }
    var colorScale;
    if (maxCalls === 0) colorScale = ['#transparent'];
    else {
      var colors = ['var(--accent-glow)', 'var(--accent)', 'var(--electric-bright)'];
      colorScale = colors;
    }
    var option = {
      tooltip: {
        position: 'top',
        formatter: function(p) {
          var d = DAYS_FULL[p.value[1]];
          return esc(d) + ' at ' + esc(p.value[0]) + ':00 — <b>' + esc(formatNum(p.value[2])) + '</b> calls';
        }
      },
      grid: { left: 50, right: 30, top: 10, bottom: 40 },
      xAxis: {
        type: 'category', data: Array.from({length:24}, function(_,i){ return i.toString().padStart(2,'0'); }),
        splitArea: { show: true, areaStyle: { color: ['transparent', 'color-mix(in srgb, var(--text) 2%, transparent)'] } },
        axisLabel: { color: 'var(--text-muted)', font: { size: 10, family: 'JetBrains Mono' }, interval: 2 },
        axisLine: { lineStyle: { color: 'var(--border)' } }
      },
      yAxis: {
        type: 'category', data: DAYS,
        axisLabel: { color: 'var(--text)', font: { size: 11, family: 'JetBrains Mono', weight: '500' } },
        axisLine: { lineStyle: { color: 'var(--border)' } }
      },
      visualMap: {
        min: 0, max: maxCalls, calculable: false, show: false,
        inRange: {
          color: ['#transparent', 'rgba(99,102,241,0.15)', 'rgba(99,102,241,0.45)', 'rgba(99,102,241,0.85)', '#818cf8']
        }
      },
      series: [{
        type: 'heatmap', data: matrix,
        label: { show: true, color: 'var(--text-faint)', font: { size: 9, family: 'JetBrains Mono' }, formatter: function(p) { return p.value[2] || ''; } },
        emphasis: { itemStyle: { borderColor: 'var(--accent)', borderWidth: 2 } }
      }]
    };
    heatmapChart.setOption(option);
    return data.peakHour;
  }

  function renderTrendChart(data) {
    if (!trendChart) trendChart = echarts.init(document.getElementById('trend-chart'));
    var rows = data.rows || [];
    if (!rows.length) return;
    var dates = rows.map(function(r) { return r.date; });
    var calls = rows.map(function(r) { return r.calls; });
    var duration = rows.map(function(r) { return +r.total_hours * 60; });
    var option = {
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          var s = '<b>' + esc(params[0].name) + '</b><br/>';
          params.forEach(function(p) { s += p.marker + esc(p.seriesName) + ': ' + esc(formatNum(p.value)) + '<br/>'; });
          return s;
        }
      },
      legend: { data: ['Calls', 'Audio (min)'], right: 10, top: 0, textStyle: { color: 'var(--text-muted)', font: { size: 10, family: 'JetBrains Mono' } } },
      grid: { left: 50, right: 20, top: 36, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLabel: { color: 'var(--text-muted)', font: { size: 10, family: 'JetBrains Mono' }, rotate: 30 }, axisLine: { lineStyle: { color: 'var(--border)' } } },
      yAxis: [
        { type: 'value', name: 'Calls', nameTextStyle: { color: 'var(--text-muted)', font: { size: 10 } }, axisLabel: { color: 'var(--text-muted)', font: { size: 10 } }, splitLine: { lineStyle: { color: 'var(--tile-border)' } } },
        { type: 'value', name: 'Audio (min)', nameTextStyle: { color: 'var(--text-muted)', font: { size: 10 } }, axisLabel: { color: 'var(--text-muted)', font: { size: 10 } }, splitLine: { show: false } }
      ],
      series: [
        {
          name: 'Calls', type: 'line', smooth: true, data: calls,
          lineStyle: { color: '#6366f1', width: 2 },
          areaStyle: { color: 'linear-gradient(180deg, rgba(99,102,241,0.25) 0%, transparent 100%)' },
          itemStyle: { color: '#6366f1' }
        },
        {
          name: 'Audio (min)', type: 'line', smooth: true, yAxisIndex: 1, data: duration,
          lineStyle: { color: '#34d399', width: 1.5 },
          areaStyle: { color: 'linear-gradient(180deg, rgba(52,211,153,0.15) 0%, transparent 100%)' },
          itemStyle: { color: '#34d399' }
        }
      ]
    };
    trendChart.setOption(option);
  }

  function renderTalkgroups(data) {
    var tbody = document.getElementById('tg-body');
    var rows = data.activity || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px;">No data — try a different system or lookback period.</td></tr>';
      return;
    }
    var html = '';
    rows.forEach(function(row, i) {
      var pillHtml = row.emergency_count > 0
        ? '<span class="pill pill-danger">⚠ ' + esc(row.emergency_count) + '</span>'
        : '<span class="pill pill-default">—</span>';
      html += '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(row.tgid) + '</td>';
      html += '<td>' + esc(row.tg_alpha_tag || '—') + '</td>';
      html += '<td>' + esc(row.tg_tag || '—') + '</td>';
      html += '<td>' + esc(row.tg_group || '—') + '</td>';
      html += '<td class="num">' + esc(formatNum(row.call_count)) + '</td>';
      html += '<td class="num">' + esc(formatDurationHours(row.total_duration / 60)) + '</td>';
      html += '<td>' + pillHtml + '</td></tr>';
    });
    tbody.innerHTML = html;
  }

  function loadAll() {
    var sysId = sysSelect.value || '';
    Promise.all([
      loadHeatmapData(720),
      loadDailyTrend(30),
      loadTalkgroupActivity(30, sysId)
    ]).then(function(results) {
      var heatmapData = results[0];
      var trendData = results[1];
      var tgData = results[2];

      // Summary tiles
      document.getElementById('stat-calls').textContent = formatNum(trendData.totalCalls);
      document.getElementById('stat-tg').textContent = formatNum(tgData.total);
      document.getElementById('stat-tg-sub').textContent = tgData.activity.length + ' with activity';
      document.getElementById('stat-audio').textContent = formatDurationHours(trendData.rows.reduce(function(s,r) { return s + (r.total_hours || 0); }, 0));

      var peak = heatmapData.peakHour;
      if (peak.count > 0) {
        document.getElementById('stat-peak').textContent = peak.hour.toString().padStart(2, '0') + ':00';
        document.getElementById('stat-peak-sub').textContent = peak.count.toLocaleString() + ' calls';
      }

      renderHeatmapChart(heatmapData);
      renderTrendChart(trendData);
      renderTalkgroups(tgData);
    }).catch(function(e) {
      loadError(e.message || 'Unknown error');
    });
  }

  sysSelect.addEventListener('change', loadAll);

  // Load systems for selector
  loadSystems().then(function(systems) {
    systems.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.system_id;
      opt.textContent = s.name;
      sysSelect.appendChild(opt);
    });
  }).catch(function(){});

  window.addEventListener('resize', function() {
    if (heatmapChart) heatmapChart.resize();
    if (trendChart) trendChart.resize();
  });

  loadAll();

  document.getElementById('themeLabel').classList.add('show');
})();
</script>
</body>
</html>
