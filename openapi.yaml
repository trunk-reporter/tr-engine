openapi: 3.0.3
info:
  title: tr-engine API
  version: 0.10.0
  contact:
    name: tr-engine
    url: https://github.com/LumenPrima/tr-engine
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Backend service for trunk-recorder data ingestion and querying.
    Provides REST APIs for accessing radio system data, calls, talkgroups,
    units, and recorder state.

    ## Authentication

    tr-engine authenticates **client software, not people**. Every client
    (a dashboard deployment, a script, an upload plugin, a website's
    backend, a phone app) holds its own **API key** and sends it as:

    ```
    Authorization: Bearer tre_<64 hex characters>
    ```

    There are no user accounts, logins, sessions or cookies. How a client
    authenticates its own users, if it has any, is up to the client. The
    operator guide and the client-developer guide are in `docs/auth.md`.

    **Scopes.** A key has one of `listen`, `edit` or `admin`, optionally
    plus `upload`, or only `upload`:

    | Scope | Grants | Implies |
    |---|---|---|
    | `listen` | Read radio data, stream events and audio, mint tickets | |
    | `edit` | Change radio metadata (tags, transcription corrections and reviews, unit-tag suggestions) | `listen` |
    | `admin` | Everything else: keys, anonymous access, identity edits, merges, maintenance, storage, SQL query, pages, imports, console logs, audit log | `edit`, `listen` |
    | `upload` | `POST /call-upload` only | |

    **Anonymous access.** A request with no credential is governed by the
    operator's *anonymous access policy*: `off` (the default; 401
    `key_required` everywhere but the public operations) or `listen`,
    optionally restricted to some systems or talkgroups. Anonymous callers
    can never edit, administer or upload. `GET /whoami` tells any client
    what applies to it.

    **Restrictions.** A `["listen"]` key, the anonymous policy and a
    ticket can be restricted to some systems and talkgroups (see the
    `Restriction` schema). A restricted credential only gets data it is
    allowed to see, and is refused (403 `restricted_credential`) by
    operations that cannot enforce a restriction.

    **Tickets.** Browsers cannot attach headers to `EventSource`,
    `<audio src>` or `WebSocket`. For those, a client with a key mints a
    short-lived (60 s to 1 h), listen-only **ticket** with
    `POST /tickets` and passes it as `?ticket=` to
    `GET /events/stream`, `GET /audio/live` or `GET /calls/{id}/audio`
    (GET and HEAD only). `?ticket=` is ignored everywhere else, and a key
    is never accepted from the URL. A stream opened with a ticket is
    closed when the ticket expires.

    **Presenting credentials.**
    - Only the `Bearer` scheme counts, with a non-empty token. Any other
      `Authorization` scheme (for example `Basic` from a proxy) is treated
      as no credential.
    - On the ticket-enabled operations, `?ticket=` takes precedence over
      an `Authorization` header.
    - A presented but invalid credential (unknown, revoked or expired key;
      bad, expired or orphaned ticket) is always 401 and never falls back
      to anonymous access.
    - `POST /call-upload` also reads the key from the multipart form
      fields `key` or `api_key`, for trunk-recorder's upload plugins.

    **Per-operation policy.** Every operation carries machine-readable
    extensions, so clients do not need to hard-code who may call what:

    - `x-scope`: `public` (no credential needed), `listen`, `edit`,
      `admin` or `upload`.
    - `x-restricted`: `enforced` (a restricted credential may call it and
      only sees allowed data; a specific resource outside the restriction
      is 404) or `deny` (a restricted credential gets 403
      `restricted_credential`).
    - `x-key-required: true`: needs an API key even when anonymous access
      is `listen` (`POST /tickets`, `GET /metrics`).

    Operations with `x-scope: listen` also work with no credential when
    the anonymous policy is `listen`, unless they are `x-key-required`.

    **Auth errors.** Error bodies are `{"code","error","detail?"}`:

    | Status | `code` | Meaning |
    |---|---|---|
    | 401 | `key_required` | No credential, and anonymous access doesn't allow this |
    | 401 | `invalid_key` | Unknown, revoked or expired key |
    | 401 | `invalid_ticket` | Malformed, expired or orphaned ticket, or one for a merged system |
    | 403 | `insufficient_scope` | The key lacks the scope the operation needs (named in the message) |
    | 403 | `restricted_credential` | The credential is restricted and this operation can't enforce that |
    | 404 | `not_found` | Also for a resource outside a restricted credential's restriction |
    | 429 | `rate_limited` | Rate limit exceeded; see `Retry-After` |
    | 503 | `service_unavailable` | The credential lookup failed; retry later |

    Every 401 carries `WWW-Authenticate: Bearer realm="tr-engine"`.

    Branch on `code`; the `error` message is for people and may change
    (the one exception is `insufficient_scope`, whose message always
    reads "this operation needs the <scope> scope"). A wrong method on an
    existing path is 405 with code `bad_request`. Paths that don't exist,
    including the removed ones below, are 404 `not_found` for every
    method.

    **Rate limits.** Requests without a key, with a ticket, with a legacy
    key, or with a key not yet known to the server are limited per client
    IP (`RATE_LIMIT_RPS`/`RATE_LIMIT_BURST`). A key with `rate_limit_rps`
    set is limited per key; other keys sent in the `Authorization` header
    are not limited. An upload that carries its key in the `key`/`api_key`
    form field has no header credential, so it is limited per client IP
    like a request without a key. It costs two per-IP tokens when the key
    is not in the 30-second key cache, and always for a legacy (imported)
    key, so those uploads get half the per-IP rate. High-volume uploaders
    should send the key as `Authorization: Bearer` (a legacy key stays
    limited per IP there too, at one token per request).

    **CORS.** No credential is ever sent automatically (no cookies), so
    every response carries `Access-Control-Allow-Origin: *` and never
    `Access-Control-Allow-Credentials`. Preflight `OPTIONS` requests are
    answered with 204 and allow the `Authorization`, `Content-Type`,
    `Last-Event-ID`, `X-Actor` and `X-Request-ID` headers. `X-Request-ID`,
    `Retry-After` and `WWW-Authenticate` are exposed to scripts.

    **Caching.** `/api/v1` JSON responses carry `Cache-Control: no-store`
    and `Vary: Authorization`; call audio carries `Cache-Control: private`.

    **Request headers.**
    - `X-Actor` (optional): free text naming the end user a multi-user
      client acts for. Recorded in the audit log, never used for
      authorization.
    - `X-Request-ID` (optional): kept when it is at most 64 characters of
      `[A-Za-z0-9._-]`, otherwise replaced; echoed in the response.

    **Removed.** `/auth-init`, `/auth/*`, `/users`, JWT login and the
    `?token=` query parameter no longer exist (404). See
    `docs/migrating-auth.md`.

    ## Data Model: Systems and Sites

    The data model separates **logical radio networks** from **recording
    sites**:

    - **System** (`system_id`): a logical radio network. For P25, this
      is the WACN-level network identified by `(sysid, wacn)`. For
      conventional, it is identified by `(instance_id, sys_name)`.
      Talkgroups and units belong to the system level because they are
      shared across all sites on the same P25 network.

    - **Site** (`site_id`): a recording point within a system. Each
      TR `sys_name` entry within an instance creates a site. For P25,
      different sites on the same network are distinguished by
      `(nac, rfss, site_id)`. A single system may have many sites
      (e.g., "butco" nac=340 and "warco" nac=34D are both sites on
      the same P25 sysid=348 network). Call recordings belong to a
      specific site.

    Example:
    ```
    System 1 (P25 sysid=348, wacn=BEE00)
      ├── Site 1 "butco"  (nac=340, rfss=4, p25_site=1)
      ├── Site 2 "warco"  (nac=34D, rfss=1, p25_site=13)
      ├── Talkgroups (shared across all sites)
      └── Units (shared across all sites)
    ```

    For conventional systems, the hierarchy is 1:1 — each system has
    exactly one site.

    Identity resolution at ingest (from MQTT `systems` message):
    - **System**: match by `(sysid, wacn)` for P25, or
      `(instance_id, sys_name)` for conventional.
    - **Site**: match by `(system_id, instance_id, sys_name)`. The
      `sys_name` (not `sys_num`) is used because `sys_num` is a
      positional index in the TR config that shifts when systems are
      added or reordered.

    This means cloning a TR config to a second box and pointing it at
    the same P25 system "just works" — both instances contribute
    recordings to the same system_id (shared talkgroups/units), each
    as a distinct site, with call groups handling deduplication.

    ## ID Formats

    - **Call ID**: database auto-increment integer (e.g., `48531`).
      Unique per recording. Opaque — clients should not parse or
      construct call IDs.
    - **Talkgroup ID**: `{system_id}:{tgid}` (e.g., `1:9178`) or
      `{system_id}-{tgid}` (e.g., `1-9178`) or plain `{tgid}` if
      unambiguous across systems. The dash format avoids issues with
      WAF rules that block colons in URL paths.
    - **Unit ID**: `{system_id}:{unit_id}` (e.g., `1:924003`) or
      `{system_id}-{unit_id}` (e.g., `1-924003`) or plain `{unit_id}`
      if unambiguous.
    - **Call Group key**: derived from `(system_id, tgid, start_unix)`.
      Multiple recordings of the same transmission (possibly from
      different sites) are grouped automatically.

    When a plain (non-composite) talkgroup or unit ID matches multiple
    systems, the API returns **409 Conflict** with the list of matching
    systems so the client can disambiguate.

    ## Pagination

    All list endpoints return:
    - `total`: total matching results across all pages
    - `limit`: page size used
    - `offset`: starting position

    ## Embedded Context

    List and detail responses embed human-readable names (system_name,
    site_short_name, talkgroup alpha_tag/description, unit alpha_tag) to
    minimize client-side lookup tables. Clients should not need to maintain
    in-memory cross-reference maps for display purposes.

servers:
  - url: /api/v1
    description: Default API base path

security:
  - bearerAuth: []

tags:
  - name: health
    description: Service health
  - name: systems
    description: Radio system and recording site operations
  - name: talkgroups
    description: Talkgroup operations
  - name: units
    description: Radio unit operations
  - name: unit-tag-suggestions
    description: |
      Review queue of candidate unit alpha tags found in transcriptions
      (opt-in via `UNIT_TAG_SUGGESTIONS=true`). Units are never modified
      until a reviewer approves a suggestion.
  - name: calls
    description: Call recording operations
  - name: call-groups
    description: Deduplicated call group operations
  - name: stats
    description: System statistics and metrics
  - name: recorders
    description: Trunk-recorder hardware state
  - name: events
    description: Real-time event streaming (SSE)
  - name: transcriptions
    description: Transcription access, search, and management
  - name: auth
    description: Credential introspection, API keys, the anonymous access policy and tickets
  - name: admin
    description: Administrative operations (system merge, maintenance, storage, SQL query, audit log). All need the `admin` scope.

# ============================================================
# PATHS
# ============================================================
paths:

  # ----------------------------------------------------------
  # Health
  # ----------------------------------------------------------
  /health:
    get:
      operationId: getHealth
      x-scope: public
      x-restricted: enforced
      summary: Health check
      description: |
        Returns service health status. Public: no credential needed.

        Callers without an unrestricted key get a summary: `status`,
        `version` and each check's status (`checks`). The full body (TR
        instance list, audio stream details including the listen address,
        uptime and the update check) is returned only to a key with
        unrestricted `listen` or better.
      tags: [health]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ----------------------------------------------------------
  # Auth: credential introspection, API keys, anonymous access, tickets
  # ----------------------------------------------------------
  /whoami:
    get:
      operationId: getWhoami
      x-scope: public
      x-restricted: enforced
      summary: Describe the caller's credential
      description: |
        Tells any client what its credential can do. Public: it needs no
        credential, but it reads the `Authorization: Bearer` header when one
        is sent and describes that key. It is not ticket-enabled
        (`?ticket=` is ignored here).

        - With a valid key: `credential: "key"`, the key's own record in
          `key`, and the effective scopes in `scopes`.
        - With no credential: `credential: "anonymous"`, `key: null`, and
          `scopes` from the anonymous access policy. Under policy `off` the
          response is still 200, with `scopes: []`.
        - With an unknown, revoked or expired key: 401 `invalid_key`, so a
          client learns at once that its key is bad. It never falls back
          to anonymous.

        `anonymous` shows every caller only whether anonymous access is on
        and whether it is restricted. The anonymous restriction itself
        (which names talkgroups the operator considers sensitive) is only
        available through the admin `GET /anonymous-access`.

        Replaces the removed `GET /auth-init` and `GET /auth/me`.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The caller's credential and effective access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
              examples:
                key:
                  summary: An edit key
                  value:
                    credential: key
                    key:
                      id: 7
                      name: tr-dashboard at home
                      prefix: tre_1a2b3c4d
                      scopes: [edit]
                      restriction: null
                      expires_at: null
                      legacy: false
                    scopes: [edit, listen]
                    restricted: false
                    anonymous:
                      access: listen
                      restricted: false
                    version: "0.10.0"
                anonymous_off:
                  summary: No credential, anonymous access off
                  value:
                    credential: anonymous
                    key: null
                    scopes: []
                    restricted: false
                    anonymous:
                      access: "off"
                      restricted: false
                    version: "0.10.0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /keys:
    get:
      operationId: listKeys
      x-scope: admin
      x-restricted: deny
      summary: List API keys
      description: |
        Returns every API key, ordered by id. Revoked keys are left out
        unless `include_revoked=true`. Plaintext keys are never returned;
        only the display `prefix`.
      tags: [auth]
      parameters:
        - name: include_revoked
          in: query
          description: Also return revoked keys
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createKey
      x-scope: admin
      x-restricted: deny
      summary: Create an API key
      description: |
        Creates a key and returns it, including the plaintext `key`, which
        is shown **exactly once** and cannot be retrieved again. Only its
        SHA-256 hash is stored.

        `scopes` holds at most one of `listen`/`edit`/`admin`, optionally
        plus `upload` (for example `["listen"]`, `["edit"]`,
        `["admin","upload"]`, `["upload"]`). `edit` implies `listen` and
        `admin` implies both, so `["listen","edit"]` is rejected. Unknown
        scope strings are rejected.

        `restriction` is only allowed when `scopes` is exactly `["listen"]`,
        and a key restriction that allows nothing is rejected
        ("restriction allows nothing"). A restriction that names a system
        involved in an earlier merge is rewritten on store, as the merge
        would have rewritten it (see `POST /admin/systems/merge`); the
        response shows the stored form. Each array holds at most 1000
        entries.

        **A key that reaches other people's browsers is public.** Only put
        a key into a web page that other people load if you would give
        its access to every visitor.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreate"
            examples:
              dashboard:
                summary: A key for a tr-dashboard you use yourself
                value:
                  name: tr-dashboard at home
                  scopes: [edit]
              upload:
                summary: A trunk-recorder upload plugin
                value:
                  name: trunk-recorder butco uploads
                  scopes: [upload]
              restricted:
                summary: A listen key restricted to one system, minus one talkgroup
                value:
                  name: club website backend
                  scopes: [listen]
                  restriction:
                    systems: [1]
                    exclude_talkgroups: ["1:5001"]
                  expires_at: "2027-01-01T00:00:00Z"
                  rate_limit_rps: 10
      responses:
        "201":
          description: Key created; `key` holds the plaintext, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /keys/{id}:
    parameters:
      - $ref: "#/components/parameters/keyId"
    get:
      operationId: getKey
      x-scope: admin
      x-restricted: deny
      summary: Get an API key
      description: Returns one key, including a revoked one.
      tags: [auth]
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKey
      x-scope: admin
      x-restricted: deny
      summary: Change an API key
      description: |
        Partially updates a key. An **absent** field is left unchanged; an
        explicit `null` clears `restriction`, `expires_at` or
        `rate_limit_rps`. The plaintext never changes; to rotate a key,
        create a new one and revoke the old one.

        - Scopes and restriction are validated together, as on create. To
          change the scopes of a restricted `["listen"]` key, send
          `"restriction": null` in the same request.
        - A new restriction that names a system already merged into
          another is rewritten on store, as the merge would have rewritten
          it; the response shows the stored form.
        - `expires_at` must be in the future.
        - A revoked key cannot be changed (409).
        - **Last-admin guard:** removing `admin` from an active admin key,
          setting an expiry earlier than its current one (or a first
          expiry), or setting or lowering its `rate_limit_rps` below 1
          request/second, is refused with 409 `conflict` unless another
          active admin key lasts at least as long as this one does now: it
          has no expiry, or one no earlier than this key's current expiry.
          Only admin keys not rate-limited below 1 request/second count as
          that other key. So the only admin key can't be given an expiry,
          or a rate limit below 1 request/second, through the API. The
          message says which case applies: "this is the last active admin
          key: create another admin key first", "every other active admin
          key expires before this one, ...", or "a rate limit below 1
          request/second on this admin key would leave no admin key that
          can lift it: ...". The `tr-engine keys update` CLI is not
          guarded (it warns instead); `tr-engine keys update ID
          --no-rate-limit` undoes an over-tight limit.

        The change takes effect on the key's next request, and on open
        event streams and audio WebSockets at once: they either pick up the
        new scopes and restriction, or close with a signal when the key no
        longer has `listen`. Outstanding tickets minted by the key are
        verified against its new state.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyPatch"
      responses:
        "200":
          description: The updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The key is revoked, or the last-admin guard applies (no other
            active admin key that isn't rate-limited below 1
            request/second, or every such key expires before this one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeKey
      x-scope: admin
      x-restricted: deny
      summary: Revoke an API key
      description: |
        Revokes the key (sets `revoked_at`; the record is kept for the
        audit trail). Idempotent: revoking a revoked key is also 204.
        Requests with the key fail with 401 `invalid_key` from then on, its
        tickets stop verifying, and its open streams close with the
        `invalid_key` signal.

        **Last-admin guard:** revoking an active admin key is refused with
        409 `conflict` unless another active admin key, not rate-limited
        below 1 request/second, lasts at least as long (it has no expiry,
        or one no earlier than this key's). The message says which case
        applies: "this is the last active admin key: ..." or "every other
        active admin key expires before this one, ...".
        (The `tr-engine keys revoke` CLI is not subject to the guard; it
        warns when no lasting admin key is left.)
      tags: [auth]
      responses:
        "204":
          description: Revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The last-admin guard applies (no other active admin key that
            isn't rate-limited below 1 request/second, or every such key
            expires before this one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /anonymous-access:
    get:
      operationId: getAnonymousAccess
      x-scope: admin
      x-restricted: deny
      summary: Get the anonymous access policy
      description: |
        Returns the policy that decides what a request with **no
        credential** may do, including its restriction lists. Other
        callers only see `{access, restricted}` in `GET /whoami`.
      tags: [auth]
      responses:
        "200":
          description: The anonymous access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putAnonymousAccess
      x-scope: admin
      x-restricted: deny
      summary: Set the anonymous access policy
      description: |
        Replaces the anonymous access policy. **Both keys are required**: a
        missing `restriction` is 400, and an explicit `"restriction": null`
        clears it (unrestricted listening).

        - `access: "off"` (the default on a fresh install): requests
          without a credential get 401 `key_required` everywhere except
          the public operations.
        - `access: "listen"`: requests without a credential may use the
          `listen` operations (never `x-key-required` ones), limited by
          `restriction` when it is set.

        A restriction that allows nothing is rejected ("use access: off
        instead"). The restriction is stored even with `access: "off"`, so
        it can be prepared in advance. A restriction that names a system
        involved in an earlier merge is rewritten on store, as the merge
        would have rewritten it; the response shows the stored form. Each
        array of a new restriction holds at most 1000 entries; the stored
        restriction sent back unchanged is accepted even when merges have
        grown it past that.

        The change applies to new requests at once. Open anonymous event
        streams and audio WebSockets pick it up at once too: they close
        with the `key_required` signal when access is now `off`, and
        otherwise continue under the new restriction.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousAccessUpdate"
            examples:
              access_off:
                summary: No anonymous access
                value:
                  access: "off"
                  restriction: null
              public_listening:
                summary: Public listening, minus two sensitive talkgroups
                value:
                  access: listen
                  restriction:
                    allow_all: true
                    exclude_talkgroups: ["1:5001", "1:5002"]
      responses:
        "200":
          description: The new policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tickets:
    post:
      operationId: createTicket
      x-scope: listen
      x-restricted: enforced
      x-key-required: true
      summary: Mint a ticket for a URL
      description: |
        Mints a short-lived, listen-only, signed **ticket** for the places
        where a browser cannot send an `Authorization` header:
        `EventSource`, `<audio src>` and `WebSocket`. Pass it as
        `?ticket=<ticket>` on the three ticket-enabled operations:
        `GET /events/stream`, `GET /audio/live` and
        `GET /calls/{id}/audio` (and `HEAD` on the same paths). It is
        ignored everywhere else.

        Requires a **key** with `listen` (via `listen`, `edit` or `admin`):
        anonymous callers get 401 `key_required` whatever the anonymous
        policy says, and upload-only keys get 403 `insufficient_scope`.
        Tickets cannot mint tickets.

        - `ttl_seconds` is clamped to 60–3600 (default 600).
        - `restriction` optionally **narrows** the ticket below the key's
          own access, for example per end user in a multi-user backend.
          It may hold at most 100 entries in total, and the encoded ticket
          must fit in 2048 bytes; otherwise 400 `invalid_body` "ticket
          restriction too large — narrow by system or mint several
          tickets". A narrowing that allows nothing is accepted: the
          ticket then sees nothing.
        - A narrowing that names a system already merged into another, in
          any array including `exclude_talkgroups`, is refused with 400
          `invalid_body` ("restriction: names a system that was merged
          into another; use the system it was merged into"). Stored key
          and anonymous restrictions keep merged-away IDs in their
          exclusions (next to a copy for the surviving system), so a
          narrowing copied from one must drop those entries. A ticket minted before such a merge fails with 401
          `invalid_ticket` on use, and a stream it opened closes with the
          `ticket_expired` signal; mint a new ticket for the merged
          system.
        - The ticket stores only the narrowing. Every use applies the
          minting key's **current** state: a revoked, expired or re-scoped
          key invalidates its tickets, and a changed key restriction
          applies to them at once.

        Tickets are not single-use (audio elements make repeated Range
        requests); a ticket is valid until it expires. An event stream or
        audio WebSocket opened with a ticket is closed when the ticket
        expires, with the `ticket_expired` signal; mint a new ticket and
        reconnect. A single ticket cannot be revoked; stop minting, wait
        for it to expire, or revoke the key.

        The body is optional; an empty body mints a 600-second ticket with
        no narrowing.
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketRequest"
            examples:
              default:
                summary: Default lifetime, no narrowing
                value: {}
              narrowed:
                summary: Narrowed to two talkgroups for one end user
                value:
                  ttl_seconds: 900
                  restriction:
                    talkgroups: ["2:9178", "2:9179"]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

