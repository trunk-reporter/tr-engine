          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Key is locked by environment variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Pipeline not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/storage/stats:
    get:
      operationId: getStorageStats
      x-scope: admin
      x-restricted: deny
      summary: Get database storage statistics
      description: |
        Returns per-table row counts and sizes from `pg_stat_user_tables`,
        plus partition breakdowns for large partitioned tables. Total
        database size is included. If a per-table stat fails, the table is
        omitted and an entry is added to `errors[]` — the rest of the
        response still returns.
        Requires the `admin` scope.
      tags: [admin, storage]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Storage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/storage/purge/{table}:
    post:
      operationId: purgeTable
      x-scope: admin
      x-restricted: deny
      summary: Manually purge old data from a table
      description: |
        Triggers an immediate purge of rows (or partitions) older than the
        specified duration. The `table` path parameter must be one of the
        allowed purgeable tables. Purge runs with a 5-minute context
        timeout — if it times out, `timed_out: true` is returned with
        a partial count.

        This action is irreversible.
        Requires the `admin` scope.
      tags: [admin, storage]
      security:
        - bearerAuth: []
      parameters:
        - name: table
          in: path
          required: true
          description: Purgeable table key (see allowlist)
          schema:
            type: string
            enum:
              - mqtt_raw_messages
              - console_messages
              - trunking_messages
              - plugin_statuses
              - call_active_checkpoints
            example: "mqtt_raw_messages"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "200":
          description: Purge completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: Purge timed out (partial results included)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResponse"

  # ----------------------------------------------------------
  # Audit log
  # ----------------------------------------------------------
  /admin/audit-log:
    get:
      operationId: listAuditLog
      x-scope: admin
      x-restricted: deny
      summary: List audit log entries
      description: |
        Returns the audit log, newest first. One entry is recorded for
        every request made with an API key to a matched route whose method
        is not GET, HEAD or OPTIONS and that the auth layer let through,
        including requests the handler itself refused (the status is the
        one the client received). Not recorded: requests without a key,
        failed authentication (401), authorization refusals by the auth
        layer (403 `insufficient_scope` or `restricted_credential`),
        `POST /call-upload` and `POST /tickets`; the access log still has
        them.

        `path` is the request path without the query string, cut at 1024
        bytes with a "…(truncated, N bytes)" marker. (The request line and
        headers together are limited to 64 KiB; a larger request gets
        431.)

        `actor` is the optional `X-Actor` request header, which a
        multi-user client sends to name the end user it acted for. It is
        recorded as given (control and format characters removed, at most
        200 characters) and is never used for authorization. Render
        `actor`, `key_name`, `path` and `request_id` as text only.

        Entries are kept for `RETENTION_AUDIT_LOG` (default `8760h`, one
        year) and purged by the daily maintenance run.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: key_id
          in: query
          description: Only entries made with this key
          schema:
            type: integer
        - name: since
          in: query
          description: Only entries at or after this time (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Only entries before this time (RFC 3339)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit log entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------
  # Debug report
  # ----------------------------------------------------------
  /debug-report:
    post:
      operationId: submitDebugReport
      x-scope: admin
      x-restricted: deny
      summary: Send a diagnostic report to the debug receiver
      description: |
        Combines the JSON body sent by the client (browser diagnostics)
        with server-side diagnostics (version, uptime, sanitized
        configuration, trunk-recorder `config.json` with secrets removed,
        recent console logs, ingest and stream state) and forwards the
        result to `DEBUG_REPORT_URL`. Secrets are redacted: values of keys
        whose names contain `key`, `token`, `pass`, `secret`, `auth` or
        `credential` (case-insensitive), and user info and query strings
        of every URL-valued string, at any depth.

        Because it makes the server send data to a third party, it needs
        the `admin` scope. Returns 503 when `DEBUG_REPORT_DISABLE=true` or
        no `DEBUG_REPORT_URL` is set. See `docs/debug-reports.md`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Client-side diagnostics; any JSON object (at most 1 MB)
      responses:
        "200":
          description: Report forwarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: The body could not be read or is not a JSON object
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: The debug receiver could not be reached or rejected the report
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: |
            Debug reports are disabled (`DEBUG_REPORT_DISABLE=true`, or no
            `DEBUG_REPORT_URL`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: service_unavailable
                error: debug reports disabled

  # ----------------------------------------------------------
  # Prometheus metrics (root path, not under /api/v1)
  # ----------------------------------------------------------
  /metrics:
    servers:
      - url: /
        description: Served at the root of the engine, not under /api/v1
    get:
      operationId: getMetrics
      x-scope: listen
      x-restricted: deny
      x-key-required: true
      summary: Prometheus metrics
      description: |
        Prometheus exposition format. Served at **`/metrics`** on the
        engine's root (not under `/api/v1`), when `METRICS_ENABLED` is true
        (the default); otherwise 404.

        Requires an **API key** with `listen` in the `Authorization`
        header: it is never public, whatever the anonymous access policy
        says, and restricted keys are refused. Create a scrape key with
        `tr-engine keys create --name prometheus --scopes listen` and set
        it as the scrape job's bearer token (`authorization.credentials`
        or `credentials_file` in `prometheus.yml`).
      tags: [health]
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Metrics are not enabled (`METRICS_ENABLED` is false)

# ============================================================
# COMPONENTS
# ============================================================
components:

  # ----------------------------------------------------------
  # Security Schemes
  # ----------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tre_<64 hex characters>
      description: |
        An API key in the `Authorization` header:
        `Authorization: Bearer tre_...`. Keys are created by an admin
        (`POST /keys` or `tr-engine keys create`). Keys are never accepted
        from the URL.
    ticketAuth:
      type: apiKey
      in: query
      name: ticket
      description: |
        A short-lived, listen-only ticket from `POST /tickets`, passed as
        `?ticket=trt_...`. Accepted only by `GET`/`HEAD` on
        `/events/stream`, `/audio/live` and `/calls/{id}/audio`, for
        browser APIs that cannot send headers (`EventSource`,
        `<audio src>`, `WebSocket`). Takes precedence over an
        `Authorization` header on those operations.

  # ----------------------------------------------------------
  # Reusable Parameters
  # ----------------------------------------------------------
  parameters:
    keyId:
      name: id
      in: path
      required: true
      description: API key ID
      schema:
        type: integer
        minimum: 1
        example: 7

    ticket:
      name: ticket
      in: query
      required: false
      description: |
        A ticket from `POST /tickets`, for clients that cannot send an
        `Authorization` header (browser `EventSource`, `<audio>`,
        `WebSocket`). Takes precedence over the header. A key is never
        accepted here.
      schema:
        type: string
        example: trt_eyJrIjo3LCJlIjoxNzkwMDAwMDAwfQ.bWFjLWJ5dGVzLWhlcmU

    callId:
      name: id
      in: path
      required: true
      description: Call record database ID
      schema:
        type: integer
        example: 48531

    talkgroupId:
      name: id
      in: path
      required: true
      description: "Talkgroup ID: `system_id:tgid` (e.g., `1:9178`) or plain `tgid`"
      schema:
        type: string
        example: "1:9178"

    unitId:
      name: id
      in: path
      required: true
      description: "Unit ID: `system_id:unit_id` (e.g., `1:924003`) or plain `unit_id`"
      schema:
        type: string
        example: "1:924003"

    suggestionId:
      name: id
      in: path
      required: true
      description: Unit tag suggestion ID
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42

    startTime:
      name: start_time
      in: query
      description: Start of time range (RFC 3339)
      schema:
        type: string
        format: date-time

    endTime:
      name: end_time
      in: query
      description: End of time range (RFC 3339)
      schema:
        type: string
        format: date-time

    limit:
      name: limit
      in: query
      description: Results per page
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

    offset:
      name: offset
      in: query
      description: Page offset (number of results to skip)
      schema:
        type: integer
        default: 0
        minimum: 0

    sort:
      name: sort
      in: query
      description: "Sort field. Prefix with `-` for descending (e.g., `-last_seen`)"
      schema:
        type: string
        default: "alpha_tag"

    sortDir:
      name: sort_dir
      in: query
      description: Sort direction (ignored if sort field uses `-` prefix)
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  # ----------------------------------------------------------
  # Reusable Responses
  # ----------------------------------------------------------
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Ambiguous:
      description: |
        Ambiguous ID — the plain ID (or, for CSV imports, the system_name)
        matches multiple systems. Response includes the list of matching
        systems to help the client disambiguate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AmbiguousError"

    Unauthorized:
      description: |
        No usable credential. `code` is `key_required` (no credential, and
        the anonymous access policy doesn't allow this operation),
        `invalid_key` (unknown, revoked or expired key) or `invalid_ticket`
        (malformed, expired or orphaned ticket).
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="tr-engine"`
          schema:
            type: string
            example: Bearer realm="tr-engine"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            key_required:
              value:
                code: key_required
                error: "an API key is required: anonymous access is off"
            invalid_key:
              value:
                code: invalid_key
                error: API key revoked

    Forbidden:
      description: |
        The credential is valid but not allowed here. `code` is
        `insufficient_scope` (the message names the scope the operation
        needs) or `restricted_credential` (the credential is restricted to
        some systems or talkgroups, and this operation can't enforce that).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            insufficient_scope:
              value:
                code: insufficient_scope
                error: this operation needs the edit scope
            restricted_credential:
              value:
                code: restricted_credential
                error: this credential is restricted to some systems or talkgroups, and this endpoint can't enforce that

    AuthUnavailable:
      description: |
        `service_unavailable`: the credential could not be checked (database
        error or timeout). Never treated as anonymous; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SuggestionNotPending:
      description: |
        The suggestion has already been decided. `detail` carries the current
        status, e.g. `status: approved`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            error: unit tag suggestion is approved, not pending
            detail: "status: approved"

    RateLimited:
      description: Too many requests — rate limit exceeded (`rate_limited`)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ----------------------------------------------------------
  # Schemas
  # ----------------------------------------------------------
  schemas:

    # ========== Enums ==========

    SystemType:
      type: string
      enum: [p25, smartnet, conventional, conventionalP25, conventionalDMR, conventionalSIGMF]
      description: |
        Radio system protocol type. The conventional variants indicate
        conventional monitoring of digital channels (P25, DMR) or SigMF
        recording sources, as opposed to pure analog conventional.

    TalkgroupMode:
      type: string
      enum: [D, A, E, M, T]
      description: |
        Talkgroup mode: D=Digital, A=Analog, E=Encrypted,
        M=Mixed (digital+analog), T=TDMA

    EventType:
      type: string
      enum: [on, off, join, call, end, data, ans_req, location, ackresp, signal, call_alert]
      description: |
        Unit event types from trunk-recorder MQTT:
        - **on**: unit registration (radio powered on / entering system)
        - **off**: unit deregistration (radio powered off / leaving system)
        - **join**: talkgroup affiliation (unit joins a talkgroup)
        - **call**: channel grant (voice call participation)
        - **end**: transmission end (per-unit end-of-transmission report)
        - **data**: data grant
        - **ans_req**: answer request
        - **location**: unit location update
        - **ackresp**: acknowledge response
        - **signal**: in-band signaling decode (MDC1200, FleetSync, STAR)
        - **call_alert**: directed unit-to-unit page (P25 TSBK 0x1F); `target_unit` and `target_unit_alpha_tag` present in SSE payload and `metadata_json`

    CallState:
      type: string
      enum: [monitoring, recording, stopped, completed]
      description: |
        Call recording state (mapped from trunk-recorder integer values):
        - **monitoring**: control channel activity seen, no audio capture yet
        - **recording**: actively capturing audio
        - **stopped**: recording ended, finalizing
        - **completed**: audio file written, ready for access

    MonState:
      type: string
      enum: [unspecified, active, duplicate]
      description: |
        Call monitor state (from trunk-recorder):
        - **unspecified**: default / not specifically monitored
        - **active**: actively monitored
        - **duplicate**: duplicate call on another recorder

    RecState:
      type: string
      enum: [available, recording, idle, stopped]
      description: |
        Recorder hardware state:
        - **available**: ready to record
        - **recording**: actively recording a call
        - **idle**: inactive / not assigned
        - **stopped**: finished recording, finalizing

    # ========== Auth Models ==========

    Scope:
      type: string
      enum: [listen, edit, admin, upload]
      description: |
        What an API key may do:
        - **listen**: read radio data (all data GETs), stream events and
          audio, mint tickets
        - **edit**: change radio metadata (talkgroup/unit tags,
          transcription corrections and review states, re-transcription,
          unit-tag-suggestion approve/dismiss); implies `listen`
        - **admin**: everything else (keys, anonymous policy, system/site
          identity edits, merges, maintenance, backfill, storage, SQL
          query, page saving, CSV imports, debug report, console logs,
          audit log); implies `edit` and `listen`
        - **upload**: `POST /call-upload` only; implies nothing

    Restriction:
      type: object
      nullable: true
      additionalProperties: false
      description: |
        Limits which radio data a `listen` credential can see. Only
        `null` (or an omitted field) means unrestricted; a restriction
        object is never treated as unrestricted.

        A (system, talkgroup) pair is allowed when both IDs are set and
        positive, **and** (`allow_all`, or the system is in `systems`, or
        the pair is in `talkgroups`), **and** the pair is not in
        `exclude_talkgroups`. Data without a talkgroup is never allowed to
        a restricted credential. With `allow_all` false and `systems` and
        `talkgroups` both empty, the restriction **allows nothing** (`{}`
        is such a restriction): that is rejected on keys and on the
        anonymous policy, and accepted on a ticket narrowing.

        A system's metadata is visible when `allow_all` is true, the
        system is in `systems`, or an entry of `talkgroups` belongs to it.

        IDs need not exist yet. Duplicates are removed and arrays are
        returned sorted. Each array in a new restriction holds at most
        1000 entries (a ticket narrowing at most 100 in total). System
        merges can grow a stored `exclude_talkgroups` past 1000; such a
        stored restriction stays valid, and sending it back unchanged
        (`PATCH /keys/{id}`, `PUT /anonymous-access`) is accepted.
        Unknown fields are rejected.

        **System merges** (see `POST /admin/systems/merge`): allow entries
        (`systems`, `talkgroups`) naming the merged-away system are
        rewritten to the surviving one. `exclude_talkgroups` are kept
        symmetric: an entry naming either the merged-away or the surviving
        system is kept and a copy naming the other is added, along chains
        of merges. A key or anonymous restriction stored later is
        rewritten the same way on store (the response shows the stored
        form). A ticket narrowing that names a merged-away system
        anywhere, `exclude_talkgroups` included, is refused with 400
        `invalid_body`, so drop merged-away IDs when you build a narrowing
        from a stored restriction.

        Operations marked `x-restricted: deny` refuse restricted
        credentials with 403 `restricted_credential`; operations marked
        `x-restricted: enforced` apply the restriction to what they return.
      properties:
        allow_all:
          type: boolean
          description: |
            Every talkgroup is a candidate (subject to
            `exclude_talkgroups`). Cannot be combined with non-empty
            `systems` or `talkgroups`. Default false.
        systems:
          type: array
          maxItems: 1000
          description: Systems whose talkgroups are allowed
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
        talkgroups:
          type: array
          maxItems: 1000
          description: Individually allowed talkgroups, as `system_id:tgid`
          items:
            $ref: "#/components/schemas/CompositeTalkgroupID"
        exclude_talkgroups:
          type: array
          description: |
            Talkgroups that are never allowed, even when their system is.
            At most 1000 entries in a new restriction; a stored list that
            system merges have grown can be longer (no `maxItems`, since
            responses and unchanged round trips may carry it).
          items:
            $ref: "#/components/schemas/CompositeTalkgroupID"
      example:
        systems: [1, 3]
        talkgroups: ["2:9178", "2:9179"]
        exclude_talkgroups: ["1:5001"]

    CompositeTalkgroupID:
      type: string
      pattern: "^[1-9][0-9]*:[1-9][0-9]*$"
      description: "`system_id:tgid`, both positive integers"
      example: "1:9178"

    APIKey:
      type: object
      required: [id, name, prefix, scopes, restriction, expires_at, rate_limit_rps, legacy, created_at, last_used_at, revoked_at, status]
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the key is for, e.g. "tr-dashboard at home" or "trunk-recorder butco uploads"
          example: tr-dashboard at home
        prefix:
          type: string
          description: |
            For display. `tre_` plus the next 8 characters of the key.
            Legacy keys imported from an old `AUTH_TOKEN`/`WRITE_TOKEN`
            show `legacy_` plus 6 hex characters of the key's hash, so no
            character of the old secret is stored.
          example: tre_1a2b3c4d
        scopes:
          type: array
          description: The key's scopes as granted (not expanded), sorted
          items:
            $ref: "#/components/schemas/Scope"
          example: [edit]
        restriction:
          description: Only on keys whose scopes are exactly `["listen"]`; `null` means unrestricted
          allOf:
            - $ref: "#/components/schemas/Restriction"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key stops working; `null` means never
        rate_limit_rps:
          type: number
          nullable: true
          description: |
            Per-key rate limit in requests per second (burst twice that,
            at least 1). `null` means no per-key limit. Legacy keys are
            always limited per client IP instead.
        legacy:
          type: boolean
          description: True for keys imported from an old `AUTH_TOKEN`/`WRITE_TOKEN` or with `tr-engine keys import`
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Last use, updated at most once a minute
        revoked_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired, revoked]
          description: Computed from `revoked_at` and `expires_at`

    APIKeyCreated:
      description: A newly created key, with its plaintext
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              pattern: "^tre_[0-9a-f]{64}$"
              description: |
                The full key. Shown exactly once, here; it cannot be
                retrieved again. Store it now. Send it as
                `Authorization: Bearer <key>`.

    APIKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          description: |
            At most one of `listen`/`edit`/`admin`, optionally plus
            `upload`. `["listen","edit"]` and unknown strings are rejected.
          items:
            $ref: "#/components/schemas/Scope"
        restriction:
          description: Only allowed when `scopes` is exactly `["listen"]`; must allow something
          allOf:
            - $ref: "#/components/schemas/Restriction"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Must be in the future when set
        rate_limit_rps:
          type: number
          nullable: true
          description: Must be greater than 0 when set
          exclusiveMinimum: true
          minimum: 0

    APIKeyPatch:
      type: object
      description: |
        Absent fields are left unchanged. An explicit `null` clears
        `restriction`, `expires_at` or `rate_limit_rps`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        restriction:
          $ref: "#/components/schemas/Restriction"
        expires_at:
          type: string
          format: date-time
          nullable: true
        rate_limit_rps:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0

    APIKeyListResponse:
      type: object
      required: [keys, total]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"
        total:
          type: integer

    AnonymousAccessLevel:
      type: string
      enum: ["off", listen]
      description: |
        What a request with no credential may do: nothing (`off`, the
        default on a fresh install) or use the `listen` operations that
        are not `x-key-required`. It can never edit, administer or upload.

    AnonymousAccess:
      type: object
      required: [access, restriction, updated_at]
      properties:
        access:
          $ref: "#/components/schemas/AnonymousAccessLevel"
        restriction:
          description: Applies to anonymous requests; `null` means unrestricted. Kept even when `access` is `off`.
          allOf:
            - $ref: "#/components/schemas/Restriction"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last change; `null` if the policy was never set
      example:
        access: listen
        restriction:
          allow_all: true
          systems: []
          talkgroups: []
          exclude_talkgroups: ["1:5001", "1:5002"]
        updated_at: "2026-09-26T12:00:00Z"

    AnonymousAccessUpdate:
      type: object
      required: [access, restriction]
      description: |
        Both keys are required. `"restriction": null` clears the restriction.
      properties:
        access:
          $ref: "#/components/schemas/AnonymousAccessLevel"
        restriction:
          $ref: "#/components/schemas/Restriction"

    Whoami:
      type: object
      required: [credential, key, scopes, restricted, anonymous, version]
      properties:
        credential:
          type: string
          enum: [key, anonymous]
          description: What the request presented. `whoami` is not ticket-enabled, so never `ticket`.
        key:
          description: The caller's key; `null` for anonymous callers
          allOf:
            - $ref: "#/components/schemas/WhoamiKey"
        scopes:
          type: array
          description: |
            Effective scopes, implications expanded, sorted: an `edit` key
            shows `["edit","listen"]`. For an anonymous caller, `["listen"]`
            when the anonymous policy is `listen`, otherwise `[]`.
          items:
            $ref: "#/components/schemas/Scope"
        restricted:
          type: boolean
          description: |
            True if any restriction applies to this caller. When true,
            operations marked `x-restricted: deny` answer 403
            `restricted_credential`.
        anonymous:
          type: object
          required: [access, restricted]
          description: The anonymous access policy, without its lists
          properties:
            access:
              $ref: "#/components/schemas/AnonymousAccessLevel"
            restricted:
              type: boolean
        version:
          type: string
          description: |
            Engine release version: the text before the first space of the
            version `/health` reports, so without its
            ` (commit=…, built=…)` suffix.
          example: "0.10.0"

    WhoamiKey:
      type: object
      nullable: true
      description: The caller's key; `null` for anonymous callers
      required: [id, name, prefix, scopes, restriction, expires_at, legacy]
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          description: The key's scopes as granted (not expanded)
          items:
            $ref: "#/components/schemas/Scope"
        restriction:
          description: The key's own restriction
          allOf:
            - $ref: "#/components/schemas/Restriction"
        expires_at:
          type: string
          format: date-time
          nullable: true
        legacy:
          type: boolean

    TicketRequest:
      type: object
      properties:
        ttl_seconds:
          type: integer
          description: Lifetime in seconds, clamped to 60–3600. Default 600.
          example: 600
        restriction:
          description: |
            Optional narrowing, intersected with the minting key's current
            restriction at every use. At most 100 entries in total. May
            allow nothing. Omitted or `null`: no narrowing.
          allOf:
            - $ref: "#/components/schemas/Restriction"

    Ticket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
          maxLength: 2048
          description: |
            `trt_<payload>.<mac>`. Treat it as opaque: pass it as
            `?ticket=` (URL-encode it like any query value). It grants
            `listen` only, and only on the ticket-enabled operations.
          example: trt_eyJrIjo3LCJlIjoxNzkwMDAwMDAwfQ.bWFjLWJ5dGVzLWhlcmU
        expires_at:
          type: string
          format: date-time

    SSEAuthSignal:
      type: object
      required: [code]
      description: |
        Payload of the `event: auth` message that `GET /events/stream`
        sends right before it closes a stream because its credential no
        longer allows it. On `ticket_expired`, mint a new ticket and
        reconnect with `last_event_id`. On any other code, do **not**
        reconnect automatically: call `GET /whoami` and ask for a key or
        explain what changed.

        - `invalid_key`: the key was revoked or reached its `expires_at`
          (header-authenticated streams too), or a ticket's key was.
        - `key_required`: an anonymous stream after anonymous access was
          turned `off`.
        - `insufficient_scope`: the key no longer has `listen`.
        - `ticket_expired`: the ticket expired, or its narrowing names a
          system that has since been merged into another; mint a new
          ticket (for the merged system) and reconnect.

        A re-check that can't reach the database keeps the stream open
        with its current access and tries again at the next re-check.
      properties:
        code:
          type: string
          enum: [invalid_key, key_required, insufficient_scope, ticket_expired]
      example:
        code: ticket_expired

    AuditLogEntry:
      type: object
      required: [id, time, key_id, key_name, actor, method, path, status, request_id]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        key_id:
          type: integer
        key_name:
          type: string
          description: The key's name when the request was made
        actor:
          type: string
          nullable: true
          description: The sanitized `X-Actor` header, if the client sent one. Informational only.
        method:
          type: string
          example: PATCH
        path:
          type: string
          description: |
            Request path, without the query string. A path over 1024
            bytes is cut there and ends with "…(truncated, N bytes)".
          example: /api/v1/talkgroups/1:9178
        status:
          type: integer
          description: HTTP status the client received
          example: 200
        request_id:
          type: string
          description: The request's `X-Request-ID`

    AuditLogResponse:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer

    # ========== Error Models ==========

    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: not_found
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - internal_error
            - service_unavailable
            - invalid_body
            - invalid_parameter
            - invalid_time_range
            - query_failed
            - ambiguous_id
            - duplicate
            - request_timeout
            - key_required
            - invalid_key
            - invalid_ticket
            - insufficient_scope
            - restricted_credential
          description: |
            Machine-readable error code for programmatic handling. Auth codes:
            - `key_required` (401): no credential, and the anonymous access
              policy doesn't allow this operation
            - `invalid_key` (401): unknown, revoked or expired key
            - `invalid_ticket` (401): malformed, expired or orphaned ticket,
              or one that references a merged-away system
            - `insufficient_scope` (403): the key lacks the needed scope
            - `restricted_credential` (403): the credential is restricted and
              this operation can't enforce that
            - `service_unavailable` (503): also when the credential lookup
              failed
            - `forbidden` (403): from the auth layer, only for a route with no
              auth policy (a server bug)
            - `bad_request` (405): also a wrong method on an existing path
        error:
          type: string
          description: |
            Human-readable message. It is informational and may change;
            branch on `code`. The one exception: `insufficient_scope`
            messages always read "this operation needs the <scope> scope".
          example: Resource not found
        detail:
          type: string
          description: Additional context when available

    AmbiguousError:
      type: object
      required: [code, error, matches]
      properties:
        code:
          type: string
          example: ambiguous_id
        error:
          type: string
          example: "Ambiguous ID 9178: exists in multiple systems"
        matches:
          type: array
          description: |
            Systems where this ID was found. Includes system_id so the
            client can construct the composite ID to disambiguate.
          items:
            type: object
            properties:
              system_id:
                type: integer
                description: Database system ID — use this to form the composite ID
                example: 1
              system_name:
                type: string
                description: System display name
                example: "Butler/Warren P25"
              sysid:
                type: string
                description: P25 SYSID (for display context)
                example: "348"

    # ========== Core Domain Models ==========

    System:
      type: object
      description: |
        A logical radio network. For P25, identified by (sysid, wacn).
        For conventional, identified by (instance_id, sys_name).
        Talkgroups and units belong to the system level.
      required: [system_id, system_type]
      properties:
        system_id:
          type: integer
          description: Database primary key — use this in API path parameters and composite IDs
          example: 1
        system_type:
          $ref: "#/components/schemas/SystemType"
        name:
          type: string
          description: |
            User-configurable display name for this system.
            Auto-populated from the first site's short_name, but can be
            overridden (e.g., "Butler/Warren P25 Network").
          example: "Butler/Warren P25"

        # P25 network identity (null/zero for conventional)
        sysid:
          type: string
          description: P25 System ID (hex). "0" for conventional.
          example: "348"
        wacn:
          type: string
          description: P25 WACN. "0" for conventional.
          example: "BEE00"
        # Sites monitoring this system
        sites:
          type: array
          description: Recording sites contributing to this system
          items:
            $ref: "#/components/schemas/Site"

    Site:
      type: object
      description: |
        A recording site — one trunk-recorder sys_name entry monitoring
        a system. Multiple sites may monitor the same P25 network from
        different locations (different NAC/RFSS/site). For conventional
        systems, there is exactly one site per system.
      required: [site_id, short_name]
      properties:
        site_id:
          type: integer
          description: Database primary key for this recording site
          example: 1
        system_id:
          type: integer
          description: Parent system this site belongs to
          example: 1
        short_name:
          type: string
          description: Trunk-recorder sys_name (e.g., "butco", "warco")
          example: butco
        instance_id:
          type: string
          description: Trunk-recorder instance that owns this site
          example: trunk-recorder
        # P25 site-specific identity
        nac:
          type: string
          description: P25 NAC (unique per physical site)
          example: "340"
        rfss:
          type: integer
          description: P25 RFSS
          example: 4
        p25_site_id:
          type: integer
          description: P25 site ID within the RFSS
          example: 1
        # TR config metadata
        sys_num:
          type: integer
          description: |
            Positional index in TR config. Stored for reference only —
            never used for identity (shifts when config is reordered).
          example: 0

    P25System:
      type: object
      description: |
        A logical P25 network with all its recording sites. This is
        the same as a System with system_type=p25, presented with
        sites expanded for the grouped network view.
      properties:
        system_id:
          type: integer
          description: Database system ID
          example: 1
        name:
          type: string
          description: User-configurable display name for this system
          example: "Butler/Warren P25"
        sysid:
          type: string
          example: "348"
        wacn:
          type: string
          example: "BEE00"
        sites:
          type: array
          description: Recording sites monitoring this P25 network
          items:
            $ref: "#/components/schemas/Site"
        talkgroup_count:
          type: integer
          example: 150
        unit_count:
          type: integer
          example: 500
        calls_24h:
          type: integer
          example: 5000

    Talkgroup:
      type: object
      description: A talkgroup on a radio system
      required: [system_id, tgid]
      properties:
        system_id:
          type: integer
          description: Database system ID this talkgroup belongs to
          example: 1
        system_name:
          type: string
          description: System display name (embedded to avoid lookup)
          example: "Butler/Warren P25"
        sysid:
          type: string
          description: P25 SYSID (for display; "0" for conventional)
          example: "348"
        tgid:
          type: integer
          example: 1001
        alpha_tag:
          type: string
          example: Fire Dispatch
        tag:
          type: string
          description: Radio Reference tag category
          example: Fire Dispatch
        group:
          type: string
          description: Grouping category for UI filtering
          example: Fire
        description:
          type: string
          example: County Fire Dispatch Channel
        mode:
          $ref: "#/components/schemas/TalkgroupMode"
        priority:
          type: integer
          description: Display priority (lower = more important)
          example: 1
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        # Stats — list endpoint uses cached values (refreshed every 5 min);
        # single-talkgroup endpoint computes live at request time.
        call_count:
          type: integer
          description: Calls in the last 30 days
          example: 1547
        calls_1h:
          type: integer
          description: Calls in the last hour
          example: 12
        calls_24h:
          type: integer
          description: Calls in the last 24 hours
          example: 234
        unit_count:
          type: integer
          description: Distinct units with any activity (calls, joins, locations, etc.) in the last 30 days
          example: 45
        # Search field (only present when search param is used)
        relevance_score:
          type: integer
          description: "Search relevance: 100=exact, 50=prefix, 10=contains. Only present in search results."
          example: 100

    Unit:
      type: object
      description: A radio unit (mobile or portable radio)
      required: [system_id, unit_id]
      properties:
        system_id:
          type: integer
          description: Database system ID this unit belongs to
          example: 1
        system_name:
          type: string
          description: System display name (embedded to avoid lookup)
          example: "Butler/Warren P25"
        sysid:
          type: string
          description: P25 SYSID (for display; "0" for conventional)
          example: "348"
        unit_id:
          type: integer
          example: 1234567
        alpha_tag:
          type: string
          example: Engine 1
        alpha_tag_source:
          type: string
          description: |
            Where the alpha tag came from: `manual` (user edit), `csv` (unit tags
            CSV via TR_DIR or `POST /unit-tags/import`), or `mqtt`. Omitted when
            the tag was discovered from MQTT/audio metadata. Priority is
            manual > csv > mqtt; lower-priority sources never overwrite higher ones.
          example: csv
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        # Last event context (embedded)
        last_event_type:
          $ref: "#/components/schemas/EventType"
        last_event_time:
          type: string
          format: date-time
        last_event_tgid:
          type: integer
          example: 9178
        last_event_tg_tag:
          type: string
          description: Alpha tag of the talkgroup from last event
          example: "09-8L Main"
        # Tag observations (auto-managed, read-only). Stored beside alpha_tag
        # and never change it or its manual > csv > mqtt priority.
        recorder_alpha_tag:
          type: string
          readOnly: true
          description: |
            Latest non-empty unit tag reported by trunk-recorder (`unit_alpha_tag`
            in MQTT unit/call messages, or the srcList `tag` in watch/upload
            modes), recorded even when a manual or CSV `alpha_tag` wins. This is
            trunk-recorder's own resolved tag: its `unitTagsFile` entry if it has
            one, otherwise the decoded over-the-air alias. Omitted if never reported.
          example: "P338 FF1"
        recorder_alpha_tag_seen:
          type: string
          format: date-time
          readOnly: true
          description: When `recorder_alpha_tag` was last reported.
        ota_alpha_tag:
          type: string
          readOnly: true
          description: |
            Latest raw over-the-air unit alias, as reported separately from the
            resolved tag: `unit_alpha_tag_ota` in MQTT unit/call messages (MQTT
            plugin), or `srcList[].tag_ota` in trunk-recorder 5.2+ call JSON
            (watch/upload modes). Latest known value only (not a history);
            replaced when a different alias is reported. trunk-recorder reports
            the latest alias it knows for the unit, so the seen times record when
            tr-engine received that report, not necessarily a fresh decode.
            Omitted until a source that sends it reports this unit.
          example: "P338 FF1"
        ota_alpha_tag_first_seen:
          type: string
          format: date-time
          readOnly: true
          description: |
            When tr-engine first recorded the current `ota_alpha_tag` value.
            Resets when the alias changes. A late report of the same alias with
            an older timestamp does not move it earlier, so it never reaches back
            past an earlier alias change (archive import and system merge move it
            earlier only when the incoming observation window overlaps).
        ota_alpha_tag_last_seen:
          type: string
          format: date-time
          readOnly: true
          description: When the current `ota_alpha_tag` value was last observed.
        call_count:
          type: integer
          description: "Number of calls within the requested time window (only present on /talkgroups/{id}/units)"
          example: 42
        # Search field
        relevance_score:
          type: integer
          description: "Search relevance: 100=exact, 50=prefix, 10=contains. Only present in search results."
          example: 100

    Call:
      type: object
      description: A recorded radio call/transmission
      required: [call_id, system_id, tgid, start_time]
      properties:
        # Identifiers
        call_id:
          type: integer
          description: Unique database ID for this recording
          example: 48531
        call_group_id:
          type: integer
          description: |
            Call group this recording belongs to. Multiple recordings of the
            same transmission (from different sites) share a call_group_id.
            Derived from (system_id, tgid, start_unix).
          example: 1

        # System context (embedded to avoid lookup)
        system_id:
          type: integer
          description: Logical radio system this call belongs to
          example: 1
        system_name:
          type: string
          description: System display name
          example: "Butler/Warren P25"
        sysid:
          type: string
          description: P25 SYSID (for display; "0" for conventional)
          example: "348"

        # Site context (which recorder captured this)
        site_id:
          type: integer
          description: Recording site that captured this call
          example: 1
        site_short_name:
          type: string
          description: TR sys_name of the capturing site (e.g., "butco", "warco")
          example: butco

        # Talkgroup context (embedded to avoid lookup)
        tgid:
          type: integer
          example: 9178
        tg_alpha_tag:
          type: string
          description: Talkgroup short-form display name
          example: "09-8L Main"
        tg_description:
          type: string
          description: Human-readable talkgroup description
          example: Middletown Police Dispatch
        tg_tag:
          type: string
          description: Functional category tag (e.g., Law Dispatch, Fire Tac)
          example: Law Dispatch
        tg_group:
          type: string
          description: Broad organizational grouping
          example: "Butler County (09) Law"

        # Timing
        start_time:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        stop_time:
          type: string
          format: date-time
          nullable: true
          description: "Null for active (in-progress) calls"
          example: "2024-01-15T10:30:45Z"
        duration:
          type: number
          description: Duration in seconds (elapsed so far for active calls)
          example: 45.5

        # Audio
        audio_url:
          type: string
          nullable: true
          description: |
            Path of this call's audio on the engine origin
            (`/api/v1/calls/{id}/audio`), or null when there is no audio yet.
            It never contains a credential. Resolve it against the engine's
            base URL (not the page's origin, if the client is served from
            elsewhere), and, when the client authenticates with a key and
            cannot send headers (an `<audio>` element), append
            `?ticket=<ticket>` from `POST /tickets`.
          example: /api/v1/calls/48531/audio
        audio_type:
          type: string
          description: "Audio encoding type from trunk-recorder (e.g., `digital`, `digital tdma`, `analog`)"
          example: digital
        audio_size:
          type: integer
          description: Audio file size in bytes
          example: 45000

        # Signal quality
        freq:
          type: integer
          description: Frequency in Hz
          example: 851012500
        freq_error:
          type: integer
          description: Frequency error in Hz
          example: 0
        signal_db:
          type: number
          nullable: true
          description: Signal strength in dB (null if unavailable; MQTT sends 999 as sentinel)
          example: -23
        noise_db:
          type: number
          nullable: true
          description: Noise floor in dB (null if unavailable; MQTT sends 999 as sentinel)
          example: -50
        error_count:
          type: integer
          description: Decode error count
          example: 2
        spike_count:
          type: integer
          description: Audio spike count
          example: 0

        # Status
        call_state:
          $ref: "#/components/schemas/CallState"
        mon_state:
          $ref: "#/components/schemas/MonState"
        emergency:
          type: boolean
          example: false
        encrypted:
          type: boolean
          example: false
        analog:
          type: boolean
          example: false
        conventional:
          type: boolean
          example: false
        phase2_tdma:
          type: boolean
          example: false
        tdma_slot:
          type: integer
          description: "TDMA slot (0=slot 1 or N/A, 1=slot 2)"
          example: 0

        # Patches
        patched_tgids:
          type: array
          description: Other talkgroup IDs patched into this call
          items:
            type: integer

        # Transmission and frequency data (JSONB columns)
        src_list:
          type: array
          description: |
            Source/transmission list from trunk-recorder's srcList.
            Each entry is a unit transmission segment within the call.
            Also available via GET /calls/{id}/transmissions.
          items:
            $ref: "#/components/schemas/CallTransmission"
        freq_list:
          type: array
          description: |
            Frequency list from trunk-recorder's freqList.
            Each entry is a frequency segment within the call.
            Also available via GET /calls/{id}/frequencies.
          items:
            $ref: "#/components/schemas/CallFrequency"
        unit_ids:
          type: array
          description: Denormalized array of distinct unit radio IDs (src values) from src_list. GIN-indexed for fast unit filtering.
          items:
            type: integer

        # Units on this call (embedded)
        units:
          type: array
          items:
            $ref: "#/components/schemas/CallUnit"

        # Transcription (denormalized from transcriptions table)
        has_transcription:
          type: boolean
          description: Whether this call has been transcribed
          example: true
        transcription_status:
          $ref: "#/components/schemas/TranscriptionStatus"
        transcription_text:
          type: string
          nullable: true
          description: Primary transcription text (null if no transcription)
          example: Engine 5 responding to the scene
        transcription_word_count:
          type: integer
          nullable: true
          example: 6

        # Extensible metadata
        metadata_json:
          type: object
          additionalProperties: true
          description: Arbitrary metadata from trunk-recorder

    CallUnit:
      type: object
      description: A unit that transmitted during a call
      required: [system_id, unit_id]
      properties:
        system_id:
          type: integer
          description: Database system ID for disambiguation in multi-system deployments
          example: 1
        unit_id:
          type: integer
          description: Unit radio ID (RID)
          example: 924003
        alpha_tag:
          type: string
          description: Unit display name
          example: "09 7COM3"

    UnitEvent:
      type: object
      description: A unit event (registration, affiliation, call activity, etc.)
      required: [id, event_type, unit_rid, unit_id, time]
      properties:
        id:
          type: integer
          example: 1
        event_type:
          $ref: "#/components/schemas/EventType"
        time:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

        # System context
        system_id:
          type: integer
          description: Database system ID
          example: 1
        system_name:
          type: string
          description: System display name
          example: "Butler/Warren P25"

        # Unit context (embedded to avoid lookup)
        unit_rid:
          type: integer
          description: "P25 Radio ID (legacy name; prefer unit_id for consistency)"
          example: 1234567
        unit_id:
          type: integer
          description: "Radio unit ID (alias for unit_rid, consistent with other endpoints)"
          example: 1234567
        unit_alpha_tag:
          type: string
          description: Unit display name (embedded to avoid lookup)
          example: Engine 1
        unit_ota_alpha_tag:
          type: string
          description: |
            Latest known raw over-the-air alias for the unit (see
            `Unit.ota_alpha_tag`). Only present in SSE payloads, and only when
            an alias is known.
          example: "P338 FF1"

        # Talkgroup context (embedded to avoid lookup)
        tgid:
          type: integer
          example: 1001
        tg_alpha_tag:
          type: string
          description: Talkgroup short-form display name
          example: "09-8L Main"
        tg_description:
          type: string
          description: Human-readable talkgroup description
          example: Middletown Police Dispatch

        # Internal references
        instance_id:
          type: string
          description: Trunk-recorder instance that reported this event
          example: trunk-recorder
        metadata_json:
          type: object
          additionalProperties: true
          description: |
            Signal events store `signaling_type` and `signal_type` here.
            Example: `{"signaling_type": "MDC1200", "signal_type": "normal"}`

        # Signal-specific fields (present only for event_type=signal, via SSE)
        signaling_type:
          type: string
          description: |
            Decoder type for signal events: `MDC1200`, `FLEETSYNC`, `STAR`,
            or `unknown` (P25 systems where TR passes null).
            Only present in SSE payloads for `unit_event:signal` events.
          example: MDC1200
        signal_type:
          type: string
          description: |
            Signal meaning: `normal` (PTT ID), `emergency`, `emergency_ack`,
            `radio_check`, `radio_stun`, `radio_revive`, and their `_ack`/`_pre` variants.
            Only present in SSE payloads for `unit_event:signal` events.
          example: normal

        # Call-alert-specific fields (present only for event_type=call_alert, via SSE)
        target_unit:
          type: integer
          description: |
            Unit ID of the radio being paged (P25 Call Alert, TSBK 0x1F).
            Only present in SSE payloads for `unit_event:call_alert` events.
          example: 4811289
        target_unit_alpha_tag:
          type: string
          description: |
            Alpha tag for the paged unit, if known.
            Only present in SSE payloads for `unit_event:call_alert` events.
          example: "OFFICER JONES"

    CallFrequency:
      type: object
      description: |
        A frequency segment from trunk-recorder's freqList. Each entry
        represents a period of time the call spent on a given frequency.
      properties:
        freq:
          type: integer
          description: Frequency in Hz
          example: 154875000
        time:
          type: string
          format: date-time
          description: When this frequency segment started (RFC 3339)
          example: "2024-04-15T19:03:22Z"
        pos:
          type: number
          description: Position in the audio file in seconds
          example: 0.0
        len:
          type: number
          description: Duration on this frequency in seconds
          example: 3.24
        error_count:
          type: integer
          example: 50
        spike_count:
          type: integer
          example: 3

    CallTransmission:
      type: object
      description: |
        A unit key-up from trunk-recorder's srcList. Each entry represents
        one unit's transmission within the call. The `src` field maps to
        the unit radio ID (RID).
      properties:
        src:
          type: integer
          description: Unit radio ID (RID) — matches unit_id in other models
          example: 104
        tag:
          type: string
          description: Unit alpha tag at time of transmission (from trunk-recorder)
          example: "09 7COM3"
        time:
          type: string
          format: date-time
          description: When this unit keyed up (RFC 3339)
          example: "2024-04-15T19:03:22Z"
        pos:
          type: number
          description: Position in audio file in seconds
          example: 0.0
        duration:
          type: number
          description: Duration of this transmission segment in seconds (computed from gap to next transmission or end of call)
          example: 3.5
        emergency:
          type: integer
          description: "Emergency flag (0=normal, 1=emergency)"
          example: 0
        signal_system:
          type: string
          description: Signal system identifier (typically empty)
          example: ""

    CallGroup:
      type: object
      description: |
        A group of duplicate call recordings from multiple recorders.
        Derived from (system_id, tgid, start_unix) — recordings that match
        on all three are grouped.
      properties:
        id:
          type: integer
          example: 1
        # System context (embedded)
        system_id:
          type: integer
          example: 1
        system_name:
          type: string
          description: System display name
          example: "Butler/Warren P25"
        sysid:
          type: string
          description: P25 SYSID (for display)
          example: "348"
        # Site that captured the primary recording
        site_id:
          type: integer
          example: 1
        site_short_name:
          type: string
          example: butco
        # Talkgroup context (embedded)
        tgid:
          type: integer
          example: 9178
        tg_alpha_tag:
          type: string
          description: Talkgroup short-form display name
          example: "09-8L Main"
        tg_description:
          type: string
          description: Human-readable talkgroup description
          example: Middletown Police Dispatch
        tg_tag:
          type: string
          description: Functional category tag
          example: Law Dispatch
        tg_group:
          type: string
          description: Broad organizational grouping
          example: "Butler County (09) Law"
        # Timing
        start_time:
          type: string
          format: date-time
        stop_time:
          type: string
          format: date-time
        duration:
          type: number
          example: 45.5
        # Group info
        call_count:
          type: integer
          description: |
            Number of recordings in this group. For a restricted
            credential, only the recordings it may see are counted.
          example: 2
        primary_call_id:
          type: integer
          description: Call ID of the best-quality recording
          example: 48531
        # Transcription (denormalized from primary call)
        has_transcription:
          type: boolean
          example: true
        transcription_status:
          $ref: "#/components/schemas/TranscriptionStatus"
        transcription_text:
          type: string
          nullable: true
          example: Engine 5 responding to the scene

    # ========== Transcription schemas ==========

    TranscriptionStatus:
      type: string
      enum: [none, auto, reviewed, verified, excluded, empty]
      description: |
        - **none**: no transcription attempted
        - **auto**: machine-transcribed, unreviewed
        - **reviewed**: passed quality checks
        - **verified**: human-verified correct
        - **excluded**: permanently excluded from dataset
        - **empty**: STT provider returned no text (no legible audio)

    TranscriptionSource:
      type: string
      enum: [auto, human, llm]
      description: |
        - **auto**: automated transcription (e.g., Whisper)
        - **human**: human correction/transcription
        - **llm**: LLM-generated correction

    Transcription:
      type: object
      description: A transcription of a call's audio content with unit attribution
      required: [id, call_id, text, source]
      properties:
        id:
          type: integer
          example: 1
        call_id:
          type: integer
          example: 48531
        text:
          type: string
          example: Engine 5 responding to the scene
        source:
          $ref: "#/components/schemas/TranscriptionSource"
        is_primary:
          type: boolean
          example: true
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          example: 0.95
        language:
          type: string
          example: en
        model:
          type: string
          example: deepdml/faster-whisper-large-v3-turbo-ct2
        provider:
          type: string
          example: whisper
        word_count:
          type: integer
          example: 6
        duration_ms:
          type: integer
          description: Transcription processing time in milliseconds
          example: 1500
        provider_ms:
          type: integer
          nullable: true
          description: Time spent in the STT provider call in milliseconds (excludes file I/O, preprocessing, DB writes)
          example: 1200
        real_time_ratio:
          type: number
          nullable: true
          description: "Ratio of provider processing time to call audio duration. Values < 1.0 mean faster than real-time. Computed as provider_ms / (call_duration * 1000)."
          example: 0.42
        created_at:
          type: string
          format: date-time
        words:
          type: object
          description: |
            Unit-attributed word timestamps and segments. The `words` array
            contains every word with timing and the radio unit that said it.
            The `segments` array groups consecutive words by the same unit; a
            change of diarization `speaker` does not start a new segment.

            Both arrays are empty when the STT model returns no timestamps
            (e.g. OpenAI `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`,
            `gpt-transcribe`, or the IMBE provider). When the model returns
            only segment-level timestamps (OpenAI `gpt-4o-transcribe-diarize`,
            or DeepInfra without word timestamps), word timings are
            approximated by spreading each segment's words evenly across it.
            Within a diarized speaker segment, words attributed to a unit
            whose transmissions overlap the segment by less than 0.5 s in
            total are moved to the unit the segment overlaps most. Words
            already on that unit stay there even when its overlap is under
            0.5 s (e.g. a short "Copy."). A segment that overlaps no
            transmission keeps per-word attribution (nearest transmission).
          properties:
            words:
              type: array
              items:
                $ref: "#/components/schemas/AttributedWord"
            segments:
              type: array
              items:
                $ref: "#/components/schemas/TranscriptionSegment"

    AttributedWord:
      type: object
      description: A word with timing and unit attribution
      required: [word, start, end, src]
      properties:
        word:
          type: string
          example: Engine
        start:
          type: number
          description: Start time in seconds from audio start
          example: 0.12
        end:
          type: number
          description: End time in seconds from audio start
          example: 0.45
        src:
          type: integer
          description: Unit/radio ID (0 if unattributed)
          example: 9130
        src_tag:
          type: string
          description: Unit alpha tag
          example: "Medic 83"
        speaker:
          type: string
          description: |
            Speaker label from a diarizing STT model (OpenAI
            `gpt-4o-transcribe-diarize` labels speakers `A`, `B`, ...).
            Omitted when the model does not diarize.
          example: "A"

    TranscriptionSegment:
      type: object
      description: Consecutive words from the same radio unit
      required: [src, start, end, text]
      properties:
        src:
          type: integer
          description: Unit/radio ID
          example: 9130
        src_tag:
          type: string
          example: "Medic 83"
        speaker:
          type: string
          description: |
            Diarization speaker label, present only when every word in the
            segment has the same label. Omitted when the STT model does not
            diarize or the segment mixes speakers (see the words' `speaker`).
          example: "A"
        start:
          type: number
          example: 0.12
        end:
          type: number
          example: 1.8
        text:
          type: string
          example: "Medic 83 transporting to Fort."

    TranscriptionSearchHit:
      type: object
      description: A search result with relevance score and call context
      properties:
        id:
          type: integer
        call_id:
          type: integer
        text:
          type: string
        source:
          type: string
        is_primary:
          type: boolean
        word_count:
          type: integer
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        rank:
          type: number
          description: Search relevance score (higher is better)
        system_id:
          type: integer
        system_name:
          type: string
        tgid:
          type: integer
        tg_alpha_tag:
          type: string
        call_start_time:
          type: string
          format: date-time
        call_duration:
          type: number
          nullable: true

    TranscriptionSearchResponse:
      type: object
      required: [results, total, limit, offset]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionSearchHit"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    BatchTranscriptionResponse:
      type: object
      required: [transcriptions]
      properties:
        transcriptions:
          type: array
          items:
            $ref: "#/components/schemas/BatchTranscriptionItem"

    BatchTranscriptionItem:
      type: object
      required: [call_id, text]
      properties:
        call_id:
          type: integer
          format: int64
        text:
          type: string
        segments:
          type: array
          description: Word segments with unit attribution (from words->'segments').
          nullable: true
          items:
            type: object
            properties:
              src:
                type: integer
                description: Unit/radio ID.
              src_tag:
                type: string
                description: Unit alpha tag.
              speaker:
                type: string
                description: Diarization speaker label, present only when every word in the segment has the same label; omitted when the STT model does not diarize or the segment mixes speakers.
              start:
                type: number
                description: Segment start in seconds.
              end:
                type: number
                description: Segment end in seconds.
              text:
                type: string
                description: Transcribed text for this segment.

    TranscriptionQueueStats:
      type: object
      properties:
        status:
          type: string
          enum: [ok, not_configured]
        pending:
          type: integer
          example: 15
        completed:
          type: integer
          example: 5000
        failed:
          type: integer
          example: 12
        performance:
          type: object
          nullable: true
          description: Aggregate STT performance from the last 100 completions
          properties:
            sample_size:
              type: integer
              example: 100
            avg_real_time_ratio:
              type: number
              nullable: true
              example: 0.38
            avg_provider_ms:
              type: number
              nullable: true
              example: 1150
            by_provider:
              type: object
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                    example: 85
                  avg_real_time_ratio:
                    type: number
                    nullable: true
                    example: 0.35
                  avg_provider_ms:
                    type: number
                    nullable: true
                    example: 1050

    StatusChangeResponse:
      type: object
      properties:
        call_id:
          type: integer
          example: 48531
        status:
          type: string
          example: verified

    Recorder:
      type: object
      description: |
        A trunk-recorder recorder (SDR channel). Core fields come directly
        from the MQTT `recorders` message. Activity fields (talkgroup, unit)
        are joined from active calls by the API layer when available.
      properties:
        id:
          type: string
          description: "Composite recorder ID from MQTT: `{src_num}_{rec_num}`"
          example: "4_16"
        src_num:
          type: integer
          description: Source number (which SDR dongle)
          example: 4
        rec_num:
          type: integer
          description: Recorder number within the source
          example: 16
        type:
          type: string
          description: Recorder type from trunk-recorder (P25, P25C, ANALOG, etc.)
          example: "P25"
        rec_state:
          $ref: "#/components/schemas/RecState"
        freq:
          type: integer
          description: Current frequency in Hz (0 when idle)
          example: 852200000
        duration:
          type: number
          description: Current recording duration in seconds
          example: 21182.10
        count:
          type: integer
          description: Number of transmissions recorded
          example: 3563
        squelched:
          type: boolean
          example: false
        # Active call context (joined by API from active calls, nullable when idle)
        tgid:
          type: integer
          nullable: true
          description: Current talkgroup ID (null when idle). Joined from active calls.
          example: 9178
        tg_alpha_tag:
          type: string
          nullable: true
          description: Current talkgroup display name. Joined from active calls.
          example: "09-8L Main"
        unit_id:
          type: integer
          nullable: true
          description: Current transmitting unit ID (null when idle). Joined from active calls.
          example: 924003
        unit_alpha_tag:
          type: string
          nullable: true
          description: Current transmitting unit display name. Joined from active calls.
          example: "09 7COM3"

    # ========== Request Models ==========

    SystemPatch:
      type: object
      description: |
        Mutable system-level fields. Only provided fields are updated.
        For P25, changing sysid/wacn affects the network identity used
        at ingest. For site-level changes (short_name, nac, instance_id),
        use SitePatch on PATCH /sites/{id}.
      properties:
        sysid:
          type: string
          description: P25 System ID (hex)
          example: "348"
        wacn:
          type: string
          description: P25 WACN
          example: "BEE00"
        name:
          type: string
          description: Optional display name for the system (e.g., "Butler/Warren P25")

    SitePatch:
      type: object
      description: |
        Mutable site-level fields. Only provided fields are updated.
        Changing `short_name` or `instance_id` updates the ingest
        lookup key — make sure the trunk-recorder config matches or
        future messages will create a new site (fragmentation).
      properties:
        short_name:
          type: string
          description: |
            Trunk-recorder sys_name. Changing this updates the
            `(instance_id, short_name)` → `site_id` mapping.
          example: butco
        instance_id:
          type: string
          description: Trunk-recorder instance ID this site belongs to
          example: trunk-recorder
        nac:
          type: string
          description: P25 NAC
          example: "340"
        rfss:
          type: integer
          example: 4
        p25_site_id:
          type: integer
          example: 1

    SystemMergeRequest:
      type: object
      required: [source_id, target_id]
      properties:
        source_id:
          type: integer
          description: System to merge FROM (will be deleted after merge)
          example: 3
        target_id:
          type: integer
          description: System to merge INTO (keeps its system_id)
          example: 1
        update_target_metadata:
          type: boolean
          description: |
            If true, copy short_name/sysid/wacn/nac from source to target
            (useful when the source has better metadata, e.g., was identified
            after the target was created as "unknown").
          default: false

    SystemMergeResponse:
      type: object
      properties:
        target_id:
          type: integer
          description: The surviving system_id
          example: 1
        source_id:
          type: integer
          description: The deleted system_id
          example: 3
        calls_moved:
          type: integer
          description: Number of call records repointed
          example: 5200
        talkgroups_moved:
          type: integer
          description: Talkgroups moved from source (source-only)
          example: 12
        talkgroups_merged:
          type: integer
          description: Talkgroups that existed in both (stats combined)
          example: 45
        units_moved:
          type: integer
          example: 30
        units_merged:
          type: integer
          example: 150
        events_moved:
          type: integer
          description: Unit events repointed
          example: 25000

    TalkgroupPatch:
      type: object
      description: Mutable talkgroup fields. Only provided fields are updated.
      properties:
        alpha_tag:
          type: string
        alpha_tag_source:
          type: string
          description: |
            Source of the alpha_tag value: `manual`, `csv`, `mqtt`, or `directory`.
            Only takes effect when no other field is changed in the same request
            (any field edit marks the talkgroup `manual`). Setting `csv` hands the
            talkgroup back to the imported talkgroup CSV: its directory values are
            re-applied on the next call. Setting `mqtt` lets MQTT ingest update it
            again until a CSV entry applies.
        description:
          type: string
        group:
          type: string
        tag:
          type: string
        priority:
          type: integer

    UnitPatch:
      type: object
      description: Mutable unit fields. Only provided fields are updated.
      properties:
        alpha_tag:
          type: string
          description: "New alpha tag. Marks the unit `alpha_tag_source: manual`. An empty string is ignored."
        alpha_tag_source:
          type: string
          description: |
            Source of the alpha_tag value: `manual`, `csv`, or `mqtt`. Only takes
            effect when no non-empty alpha_tag is set in the same request. Setting `csv` or
            `mqtt` releases a manual tag so a CSV re-import (or, for `mqtt`, MQTT
            ingest) can update it again.

    UnitTagEvidence:
      type: object
      description: |
        One call in which the unit identified itself with the candidate tag.
        Suggestions keep the 10 most recent (newest first).
      required: [call_id, call_start_time, transcription_id, tgid, excerpt, pattern, start, end, audio_url]
      properties:
        call_id:
          type: integer
          format: int64
          example: 48531
        call_group_id:
          type: integer
          format: int64
          description: |
            Call group of the call (omitted when it has none). Other sites'
            recordings of the same transmission share it and are not counted again.
          example: 20417
        call_start_time:
          type: string
          format: date-time
        transcription_id:
          type: integer
          format: int64
        tgid:
          type: integer
          example: 9178
        tg_alpha_tag:
          type: string
          description: Talkgroup alpha tag at the time of the call (omitted when empty)
          example: "BC Fire Dispatch"
        excerpt:
          type: string
          description: The unit's own transmission text (max 240 characters)
          example: "County, Medic 12 on scene."
        pattern:
          type: string
          description: |
            Extraction rule that matched: `addressee_caller` ("County, Medic 12 ..."),
            `unit_caller` ("Engine 5, Medic 12."), `caller_to` ("Medic 12 to County"),
            `from_caller` ("Command from Engine 5"), `this_is` ("this is Rescue 2"),
            `status` ("Engine 5 on scene"), `bare` (the whole transmission is the ID).
          enum: [addressee_caller, unit_caller, caller_to, from_caller, this_is, status, bare]
        start:
          type: number
          format: double
          description: Seconds into the call audio where the unit's transmission starts
        end:
          type: number
          format: double
          description: Seconds into the call audio where the unit's transmission ends
        audio_url:
          type: string
          description: |
            Path of the call's audio on the engine origin (same as
            `GET /calls/{id}/audio`; 404 if the call has no audio). Never
            contains a credential; see `Call.audio_url` for how to use it.
          example: /api/v1/calls/48531/audio

    UnitTagSuggestion:
      type: object
      description: A candidate alpha tag for one unit, with accumulated evidence.
      required:
        - id
        - system_id
        - unit_id
        - unit_alpha_tag
        - tag_key
        - proposed_tag
        - status
        - occurrences
        - call_count
        - share
        - matches_current_tag
        - first_seen
        - last_seen
        - applied_tag
        - previous_tag
        - previous_tag_source
        - decided_at
        - decided_by
        - created_at
        - updated_at
        - evidence
      properties:
        id:
          type: integer
          format: int64
          example: 42
        system_id:
          type: integer
          example: 1
        system_name:
          type: string
          example: "Butler/Warren P25"
        unit_id:
          type: integer
          example: 1234567
        unit_alpha_tag:
          type: string
          description: The unit's current alpha tag ("" if none)
          example: ""
        unit_alpha_tag_source:
          type: string
          description: Source of the unit's current alpha tag (omitted when empty)
          example: mqtt
        tag_key:
          type: string
          description: Normalized comparison key (uppercase, spoken numbers as digits)
          example: "MEDIC 12"
        proposed_tag:
          type: string
          description: Display form of the candidate
          example: "Medic 12"
        status:
          type: string
          enum: [pending, approved, dismissed]
        occurrences:
          type: integer
          description: Total self-identifications with this tag (a call can contribute several)
          example: 6
        call_count:
          type: integer
          description: Distinct calls with this self-identification (multi-site recordings of one transmission count once)
          example: 4
        share:
          type: number
          format: double
          description: This candidate's call_count as a fraction of all of the unit's candidates' call_counts
          example: 0.8
        matches_current_tag:
          type: boolean
          description: |
            True when the unit's alpha tag already names this designator —
            the whole tag, a designator inside it ("BCFD Medic 12"), or its
            phonetic letter form ("1P31" for "1 Paul 31"). Computed at the last
            sighting; if the unit's tag has changed since, it is re-checked
            live against the new tag (whole tag or whole words inside it,
            ignoring case and punctuation; phonetic forms are re-checked at
            the next sighting). Such pending rows are not listed.
        first_seen:
          type: string
          format: date-time
          description: Start time of the earliest call with this self-identification
        last_seen:
          type: string
          format: date-time
        applied_tag:
          type: string
          nullable: true
          description: Tag written to the unit on approval (proposed_tag or the override)
        previous_tag:
          type: string
          nullable: true
          description: The unit's alpha tag before approval
        previous_tag_source:
          type: string
          nullable: true
          description: The unit's alpha_tag_source before approval
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          nullable: true
          description: |
            Who decided: the name of the API key used, followed by
            ` / <actor>` when the client sent an `X-Actor` header. Decisions
            recorded by versions before API keys hold a username, or null.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/UnitTagEvidence"

    UnitTagScannerStatus:
      type: object
      description: Background scanner configuration and backfill progress.
      required: [enabled, min_calls, min_share, last_transcription_id, max_transcription_id, updated_at]
      properties:
        enabled:
          type: boolean
          description: Whether the scanner runs in this process (`UNIT_TAG_SUGGESTIONS`)
        min_calls:
          type: integer
          description: Review gate — `UNIT_TAG_SUGGESTIONS_MIN_CALLS`
          example: 3
        min_share:
          type: number
          format: double
          description: Review gate — `UNIT_TAG_SUGGESTIONS_MIN_SHARE`
          example: 0.2
        last_transcription_id:
          type: integer
          format: int64
          description: Highest transcription ID processed (0 if never run)
        max_transcription_id:
          type: integer
          format: int64
          description: Highest transcription ID in the database; the scanner is caught up when equal
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last time the scanner advanced (null if it never ran)

    UnitTagSuggestionApprove:
      type: object
      description: Optional approval body. Omit (or send `{}`) to apply `proposed_tag`.
      properties:
        alpha_tag:
          type: string
          description: Tag to apply instead of `proposed_tag` (trimmed; must not be blank)
          example: "BCFD Medic 12"

    # ========== Response Wrappers ==========

    HealthResponse:
      type: object
      required: [status]
      description: |
        Without an unrestricted `listen` (or better) key, only `status`,
        `version` and `checks` are present.
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
          description: |
            Full engine version, with the commit and build time. `GET
            /whoami` reports only the part before the first space.
          example: "0.10.0 (commit=abc1234, built=2026-09-26T12:00:00Z)"
        uptime_seconds:
          type: integer
          example: 86400
        checks:
          type: object
          description: Individual subsystem health
          properties:
            database:
              type: string
              enum: [ok, error]
            mqtt:
              type: string
              enum: [ok, error, disconnected, not_configured]
            file_watcher:
              type: string
              enum: [watching, backfilling, stopped]
              description: File watcher ingest status. Only present when WATCH_DIR is configured.
            transcription:
              type: string
              enum: [ok, unavailable, not_configured]
        trunk_recorders:
          type: array
          description: Status of connected trunk-recorder instances
          items:
            type: object
            properties:
              instance_id:
                type: string
                example: "trunk-recorder"
              status:
                type: string
                example: "connected"
              last_seen:
                type: string
                format: date-time
        update_available:
          type: boolean
          description: Whether a newer version is available. Only present when UPDATE_CHECK_URL is configured.
        latest_version:
          type: string
          description: Latest available version string. Only present when an update is available.
          example: "v0.9.0"
        release_url:
          type: string
          description: URL to the release page. Only present when an update is available.
          example: "https://github.com/LumenPrima/tr-engine/releases/tag/v0.9.0"
        audio_stream:
          type: object
          description: Live audio streaming status. Only present when STREAM_LISTEN is configured.
          properties:
            enabled:
              type: boolean
              description: Whether live audio streaming is enabled
              example: true
            listen:
              type: string
              description: The audio stream source address
              example: "localhost:9123"
            active_encoders:
              type: integer
              description: Number of active audio encoders (one per talkgroup with active audio)
              example: 3
            connected_clients:
              type: integer
              description: Number of connected WebSocket clients
              example: 5
            last_chunk_received:
              type: string
              format: date-time
              nullable: true
              description: ISO 8601 timestamp of the last audio chunk received from the stream source. Null if no chunks have been received yet.
              example: "2026-03-05T14:30:00Z"

    # --- Paginated list responses ---

    SystemListResponse:
      type: object
      required: [systems, total]
      properties:
        systems:
          type: array
          items:
            $ref: "#/components/schemas/System"
        total:
          type: integer
          description: Total number of systems
          example: 3

    P25SystemListResponse:
      type: object
      required: [systems, total]
      properties:
        systems:
          type: array
          items:
            $ref: "#/components/schemas/P25System"
        total:
          type: integer
          description: Total number of P25 networks
          example: 2

    TalkgroupListResponse:
      type: object
      required: [talkgroups, total, limit, offset]
      properties:
        talkgroups:
          type: array
          items:
            $ref: "#/components/schemas/Talkgroup"
        total:
          type: integer
          description: Total matching results (across all pages)
          example: 150
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

