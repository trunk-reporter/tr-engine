  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # Events (SSE)
  # ----------------------------------------------------------
  /events/stream:
    get:
      operationId: streamEvents
      x-scope: listen
      x-restricted: enforced
      summary: Real-time event stream (SSE)
      description: |
        Opens a Server-Sent Events (SSE) connection that pushes real-time
        events as they are ingested from MQTT. The server filters events
        based on the query parameters — only matching events are sent.

        > **Note:** This is a streaming endpoint. Swagger UI's "Try it out"
        > will hang indefinitely waiting for the response to complete.
        > Use the [Live Events](/events.html) page or connect with
        > `curl` / `EventSource` instead.

        **Authentication:** one of
        - `Authorization: Bearer <key>`, for clients that can send headers
          (servers, scripts, `fetch`-based stream readers);
        - `?ticket=<ticket>` from `POST /tickets`, for the browser
          `EventSource`, which cannot send headers (mint the ticket right
          before each connect; it takes precedence over a header);
        - no credential, when the anonymous access policy is `listen`.

        **Connection behavior:**
        - Response uses `Content-Type: text/event-stream`
        - The server sends `X-Accel-Buffering: no` for nginx compatibility
        - A keepalive comment (`: keepalive`) is sent every 15 seconds
        - Each event includes a unique `id` field for gap recovery
        - On reconnect, pass the last received ID to resume without missing
          events (buffered for 60 seconds): in the `Last-Event-ID` header,
          or, when re-creating an `EventSource` with a fresh ticket (which
          cannot set that header), in the `last_event_id` query parameter.
          The header wins when both are sent.
        - A 429 (rate limited) ends a browser `EventSource` for good; back
          off and reconnect yourself.

        **Access re-checks and the `auth` signal:** the server re-checks
        the stream's credential every 60 seconds, at once when a key, the
        anonymous policy or a system merge changes, and when the stream's
        key reaches its `expires_at`. If the credential changed but still
        has `listen`, the stream continues under the new scopes and
        restriction. Otherwise, and when a ticket expires, the server
        sends one final message and closes the stream:

        ```
        event: auth
        data: {"code":"ticket_expired"}
        ```

        `code` is `invalid_key`, `key_required`, `insufficient_scope` or
        `ticket_expired` (see `SSEAuthSignal`). On `ticket_expired`, mint a
        new ticket and reconnect with `last_event_id`. On any other code,
        do **not** reconnect automatically: call `GET /whoami` and ask for
        a key or explain what changed. The `auth` message is always sent,
        whatever the `types` filter says.

        - A header-authenticated stream has no ticket timer, but it closes
          with `invalid_key` when its key reaches `expires_at` or is
          revoked, and with `insufficient_scope` when the key loses
          `listen`.
        - A ticket stream whose narrowing names a system that has since
          been merged into another closes with `ticket_expired`: mint a
          new ticket naming the merged system.
        - If a re-check can't reach the database, the stream stays open
          with its current access and is checked again at the next
          re-check (60 s, or the next change). A ticket stream still
          closes when its ticket expires.

        **Per-type access:** each event type needs a minimum scope, and
        restricted credentials only receive events for talkgroups their
        restriction allows (see `SSEEventType`). This is applied before the
        filters below. Anonymous listeners and `listen`/`edit` keys never
        receive `console` events.

        **Event format:**
        ```
        id: 1707912345000-9f86d081884c7d659a2feaa0c55ad015
        event: call_start
        data: {"call_id": 48531, "system_id": 1, "tgid": 9178, ...}
        ```

        Event IDs are opaque strings (currently `<unix_ms>-<32 hex
        characters>`), unique within one engine process but not
        sequential. Don't parse or compare them; only send the last one
        back to resume.

        **Filtering:**
        All filter parameters are optional. With no filters, all events for
        all systems are streamed. Filters are AND-ed: specifying both
        `systems` and `tgids` means "events matching these systems AND
        these talkgroups." To change filters, disconnect and reconnect
        with new parameters — SSE `Last-Event-ID` provides gapless recovery.

        **Event types:**

        | Event | Description | Payload |
        |-------|-------------|---------|
        | `call_start` | New call recording started | Call object (partial — no audio/transcription yet) |
        | `call_update` | Call updated (new transmission, freq change) | Call object (partial delta) |
        | `call_end` | Call recording completed | Call summary: `call_id`, `system_id`, `tgid`, `tg_alpha_tag`, `unit`, `unit_alpha_tag`, `freq`, `start_time`, `stop_time`, `duration`, `emergency`, `encrypted`, plus ingest-path-specific fields. **No `audio_url`**: fetch `GET /calls/{call_id}` for the full call, or use `/api/v1/calls/{call_id}/audio` |
        | `transcription` | Transcription finished | `call_id`, `system_id`, `tgid`, `text`, `word_count`, plus provider statistics |
        | `unit_event` | Unit lifecycle event | UnitEvent object |
        | `recorder_update` | Recorder state changed | Recorder object |
        | `rate_update` | Decode rate update | DecodeRate object |
        | `trunking_message` | P25 control channel message | TrunkingMessage object |
        | `console` | TR console log message (`admin` keys only) | ConsoleMessage object |
        | `auth` | Credential no longer allows the stream; the stream closes | SSEAuthSignal object |

      tags: [events]
      security:
        - bearerAuth: []
        - ticketAuth: []
      parameters:
        - $ref: "#/components/parameters/ticket"
        - name: last_event_id
          in: query
          description: |
            Resume after this event ID, like the `Last-Event-ID` header
            (which wins when both are sent). For clients that re-create an
            `EventSource` with a fresh ticket and so cannot set the header.
          schema:
            type: string
            example: 1707912345000-9f86d081884c7d659a2feaa0c55ad015
        - name: Last-Event-ID
          in: header
          description: Resume after this event ID (sent automatically by `EventSource` on its own reconnects)
          schema:
            type: string
        - name: systems
          in: query
          description: |
            Comma-separated system IDs to subscribe to. Omit for all systems.
          schema:
            type: string
            example: "1,2"
        - name: sites
          in: query
          description: |
            Comma-separated site IDs. Omit for all sites within the
            selected systems.
          schema:
            type: string
            example: "1,3"
        - name: tgids
          in: query
          description: |
            Comma-separated talkgroup IDs to filter on. These are plain
            `tgid` values scoped to the selected systems. Omit for all
            talkgroups.
          schema:
            type: string
            example: "9178,5344"
        - name: units
          in: query
          description: |
            Comma-separated unit radio IDs (RIDs) to filter on. Omit for
            all units.
          schema:
            type: string
            example: "924003,104"
        - name: types
          in: query
          description: |
            Comma-separated event types to subscribe to. Omit for all
            event types the credential may receive. Valid values:
            `call_start`, `call_update`, `call_end`, `transcription`,
            `unit_event`, `recorder_update`, `rate_update`,
            `trunking_message`, `console`. Asking for a type the credential
            may not receive is not an error; those events are simply not
            sent.

            Supports compound syntax with `:` to filter on event
            subtypes. For example, `unit_event:call` matches only unit
            call events, while plain `unit_event` matches all unit event
            subtypes (on, off, call, end, join, location, ackresp, data, signal).
            Compound and plain values can be mixed:
            `unit_event:call,unit_event:end,call_start`.
          schema:
            type: string
            example: "call_start,call_end,unit_event:call"
        - name: emergency_only
          in: query
          description: |
            If true, only push events with the emergency flag set.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: SSE event stream opened
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  # ----------------------------------------------------------
  # Live Audio (WebSocket)
  # ----------------------------------------------------------
  /audio/live:
    get:
      operationId: streamAudioLive
      x-scope: listen
      x-restricted: enforced
      summary: Live audio stream (WebSocket)
      description: |
        WebSocket upgrade endpoint for real-time audio streaming. Clients
        receive live radio audio as binary frames with a compact header.

        > **Note:** This feature is only available when `STREAM_LISTEN` is
        > configured to point at a trunk-recorder audio stream source.
        > Returns 404 when not enabled.

        **Connection lifecycle:**
        1. Client opens a WebSocket connection to this endpoint.
        2. Client sends a JSON text frame to subscribe to specific talkgroups:
           `{"type": "subscribe", "tgids": [1001, 1002], "systems": [1]}`
        3. Server pushes binary audio frames and JSON control frames.
        4. Client sends `{"type": "unsubscribe"}` to stop receiving audio.

        **Binary audio frames (server → client):**
        Each binary frame contains a 12-byte header followed by audio data:

        | Offset | Size | Type | Field |
        |--------|------|------|-------|
        | 0–1 | 2 | uint16 BE | system_id |
        | 2–5 | 4 | uint32 BE | tgid |
        | 6–9 | 4 | uint32 BE | timestamp (ms since connection) |
        | 10–11 | 2 | uint16 BE | seq (per-connection sequence number) |
        | 12+ | variable | bytes | audio data (PCM int16 LE or Opus) |

        **JSON text frames (server → client):**
        - Keepalive (every 15s): `{"type": "keepalive", "active_streams": 2}`.
          `active_streams` counts the live talkgroup streams; for a
          restricted credential, only those on talkgroups it may hear.
        - Call start: `{"type": "call_start", "system_id": 1, "tgid": 9178, ...}`
        - Call end: `{"type": "call_end", "system_id": 1, "tgid": 9178, ...}`

        **JSON text frames (client → server):**
        - Subscribe: `{"type": "subscribe", "tgids": [1001, 1002], "systems": [1]}`
        - Unsubscribe: `{"type": "unsubscribe"}`

        **Liveness and limits:** the server sends a WebSocket ping with
        every keepalive (every 15 s). It closes a connection from which it
        has received nothing, pongs included, for 60 seconds (browsers
        answer pings automatically), and closes with 1009 (message too
        big) when a client message is over 64 KiB.

        **Authentication:** `Authorization: Bearer <key>` for clients that
        can set headers on the upgrade request, `?ticket=<ticket>` from
        `POST /tickets` for the browser `WebSocket` (which cannot), or no
        credential when the anonymous access policy is `listen`. Any
        `Origin` is accepted: there are no ambient credentials to protect.

        **Restricted credentials** only ever receive audio for talkgroups
        their restriction allows, whatever the subscribe message asks for.

        **Close codes:** the server re-checks the connection's credential
        every 60 seconds, at once when a key, the anonymous policy or a
        system merge changes, and when the connection's key reaches its
        `expires_at`. It closes the socket when the credential no longer
        allows listening or when its ticket expires. A ticket whose
        narrowing names a system that has since been merged into another
        closes with `ticket_expired` (mint a new ticket for the merged
        system). If a re-check can't reach the database, the connection
        stays open with its current access until the next re-check.

        | Close code | Reason (the code string) | What to do |
        |---|---|---|
        | 4401 | `ticket_expired` | Mint a new ticket and reconnect |
        | 4401 | `invalid_key`, `key_required` | Don't reconnect automatically; call `GET /whoami` |
        | 4403 | `insufficient_scope` | Don't reconnect automatically; call `GET /whoami` |

      tags: [events]
      security:
        - bearerAuth: []
        - ticketAuth: []
      parameters:
        - $ref: "#/components/parameters/ticket"
      responses:
        "101":
          description: WebSocket upgrade successful
        "401":
