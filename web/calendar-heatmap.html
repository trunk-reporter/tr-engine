<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="auth.js?v=3"></script>
  <meta name="card-title" content="Calendar Heatmap">
  <meta name="card-description" content="Daily call volume calendar heatmap">
  <meta name="card-order" content="25">
  <title>Calendar Heatmap — tr-engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="theme-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body); font-weight: var(--font-weight-body);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.5s, color 0.4s;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { flex: 1; padding: 80px 24px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .controls label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .controls select { background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: var(--radius-xs); color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; outline: none; }
    .control-group { display: flex; align-items: center; gap: 6px; }
    .chart-wrap { background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: var(--radius-sm); position: relative; }
    .loading-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-muted); font-size: 14px; }
    .info { text-align:center;padding-top:12px;font-size:11px;color:var(--text-muted); }
    @media (max-width: 600px) { .wrap { padding: 60px 12px 20px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Calendar Heatmap</h1>
    <p class="subtitle">Daily call volume — GitHub-style contribution calendar</p>
    <div class="controls">
      <div class="control-group">
        <label for="windowSelect">Time Window</label>
        <select id="windowSelect">
          <option value="365" selected>365 days</option>
          <option value="180">180 days</option>
          <option value="90">90 days</option>
          <option value="30">30 days</option>
        </select>
      </div>
      <button id="refreshBtn" style="background:var(--accent);border:none;border-radius:var(--radius-xs);color:#fff;font-family:var(--font-mono);font-size:12px;padding:6px 14px;cursor:pointer;">Refresh</button>
    </div>
    <div class="section">
      <div id="chart-wrap" class="chart-wrap" style="height:60vh;"><span class="loading-text">Loading…</span></div>
    </div>
    <div class="info">
      ECharts Calendar Heatmap · Data from /api/v1/calls · Hover for details
    </div>
  </div>
  <script src="theme-engine.js?v=2"></script>
  <script>
  (function() {
    var chartInstance;
    var githubColors = ['#161b22', '#0e4429', '#006032', '#00a042', '#2da44e', '#39d353'];

    async function apiFetch(url) {
      var res = await fetch(url);
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }

    async function loadData() {
      var el = document.getElementById('chart-wrap');
      el.classList.add('loading');
      el.innerHTML = '<span class="loading-text">Loading…</span>';

      try {
        var days = parseInt(document.getElementById('windowSelect').value);
        var cutoff = Date.now() - days * 86400000;
        var sysResp = await apiFetch('/api/v1/systems');
        var sysList = (sysResp && sysResp.systems) || [];
        var dailyData = {}; // "YYYY-MM-DD" -> { calls, emergency }

        // Fetch calls for all systems
        for (var s = 0; s < sysList.length; s++) {
          var sid = sysList[s].system_id;
          var url = '/api/v1/calls?system_id=' + sid + '&limit=50000&sort=-start_time';
          var callsResp = await apiFetch(url);
          var calls = (callsResp && callsResp.calls) || [];

          for (var i = 0; i < calls.length; i++) {
            var ts = new Date(calls[i].start_time);
            if (ts.getTime() < cutoff) continue;
            var key = ts.getFullYear() + '-' + String(ts.getMonth() + 1).padStart(2, '0') + '-' + String(ts.getDate()).padStart(2, '0');
            if (!dailyData[key]) dailyData[key] = { calls: 0, emergency: 0 };
            dailyData[key].calls++;
            if (calls[i].emergency) dailyData[key].emergency++;
          }
        }

        // Build calendar array: [['YYYY-MM-DD', callCount, emergencyCount], ...]
        var calendarData = [];
        var maxCalls = 0;
        var sortedDays = Object.keys(dailyData).sort();
        for (var i = 0; i < sortedDays.length; i++) {
          calendarData.push([sortedDays[i], dailyData[sortedDays[i]].calls, dailyData[sortedDays[i]].emergency]);
          if (dailyData[sortedDays[i]].calls > maxCalls) maxCalls = dailyData[sortedDays[i]].calls;
        }

        if (calendarData.length === 0) {
          el.innerHTML = '<span class="loading-text">No data for selected period</span>';
          return;
        }

        // Determine range
        var firstDate = new Date(sortedDays[0]);
        var lastDate = new Date(sortedDays[sortedDays.length - 1]);
        var range = firstDate.getFullYear() + '-' + (firstDate.getMonth() + 1);
        if (days > 350) {
          range = firstDate.getFullYear().toString();
        }

        renderChart(calendarData, range, maxCalls);
      } catch(e) {
        el.innerHTML = '<span class="loading-text">Error: ' + trAuth.escapeHTML(e.message) + '</span>';
        el.classList.remove('loading');
        console.error('Calendar heatmap error:', e);
      }
    }

    function renderChart(calendarData, range, maxCalls) {
      var el = document.getElementById('chart-wrap');
      if (chartInstance) chartInstance.dispose();
      chartInstance = echarts.init(el);

      var heatColors = ['#0d1117', '#1b262e', '#1f4960', '#29eb60', '#5ea140', '#f2a845'];
      var visualMax = Math.max(maxCalls, 1);

      chartInstance.setOption({
        tooltip: {
          formatter: function(params) {
            var esc = trAuth.escapeHTML;
            return esc(params.name) + '<br/>Calls: ' + esc(params.value[1]) + '<br/>Emergency: ' + esc(params.value[2]);
          },
          backgroundColor: 'rgba(0,0,0,0.85)',
          borderColor: 'rgba(255,255,255,0.1)',
          textStyle: { fontSize: 12, color: '#ddd' }
        },
        visualMap: {
          type: 'piecewise',
          orient: 'horizontal',
          left: 'center',
          bottom: 10,
          min: 0,
          max: visualMax,
          dimension: 1,
          seriesIndex: 0,
          textStyle: { color: 'rgba(255,255,255,0.4)', fontSize: 10 },
          inRange: {
            color: ['#0d1117', '#1b262e', '#d6204', '#9e6f6', '#f2a845']
          },
          calculable: true,
          pieces: []
        },
        calendar: {
          range: range,
          cellSize: ['auto', 16],
          orient: 'vertical',
          dayLabel: { map: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], show: true },
          monthLabel: { show: true, nameMap: 'en' },
          itemStyle: { borderColor: 'rgba(255,255,255,0.06)', borderWidth: 1 }
        },
        series: [{
          type: 'heatmap',
          coordinateSystem: 'calendar',
          data: calendarData
        }]
      });

      // Update visualMap to match actual color scheme (not piecewise which causes issues - use continuous instead)
      chartInstance.setOption({
        visualMap: {
          type: 'continuous',
          orient: 'horizontal',
          left: 'center',
          bottom: 10,
          min: 0,
          max: visualMax,
          dimension: 1,
          seriesIndex: 0,
          textStyle: { color: 'rgba(255,255,255,0.4)', fontSize: 10 },
          inRange: {
            color: ['#0d1117', '#1b262e', '#0a3060', '#280040', '#4ea140', '#f2a845']
          }
        }
      });

      var observer = new ResizeObserver(function() { chartInstance.resize(); });
      observer.observe(el);
      el.classList.remove('loading');
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('windowSelect').addEventListener('change', loadData);

    loadData();
  })();
  </script>
</body>
</html>
